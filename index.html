,"track":"A","source":"115 學測數 A 第 5 題","concept":"矩陣乘法與線性方程組解的個數","stem":"已知實數三階方陣 $A=[[1,0,1;0,1,0;1,0,1]]$。試問有多少個行向量 $v=[[v_1;v_2;v_3]]$ 滿足 $Av=[[2;0;2]]$，且 $v$ 垂直於 $[[0;1;0]]$？","options":["(1) 1 個","(2) 2 個","(3) 3 個","(4) 0 個","(5) 無窮多個"],"answer":"(5)","explanation":["計算 $Av$：$c_{11}=(1)(v_1)+(0)(v_2)+(1)(v_3)=v_1+v_3$，$c_{21}=(0)(v_1)+(1)(v_2)+(0)(v_3)=v_2$，$c_{31}=(1)(v_1)+(0)(v_2)+(1)(v_3)=v_1+v_3$。","由 $Av=[[2;0;2]]$ 得：$v_1+v_3=2$、$v_2=0$。","$v$ 垂直於 $[[0;1;0]]$ 得 $v_2=0$（已滿足）。","故 $v=(t,0,2-t)$，其中 $t$ 為任意實數，有無窮多個。","觀念回顧：線性方程組若未知數個數多於獨立方程式個數，則有無窮多解；向量垂直即內積為 $0$。"],"hasFigure":true},{"id":"u14a_15","unit":"十四","chapter":"矩陣","track":"A","source":"115 學測數 A 第 8 題","concept":"矩陣乘冪與遞迴關係","stem":"已知二階方陣 $A=[[3,1;1,0]]$，且對所有正整數 $n\\geq 2$，令 $A^n=[[a_n,b_n;c_n,d_n]]$，試選出正確的選項。","options":["(1) $b_2<c_2$","(2) $A^2=3A+I$（$I$ 為二階單位方陣）","(3) $c_{n+2}=c_{n+1}+c_n$","(4) $A^n$ 將行向量 $(1,1)$ 映射為 $(b_{n+1},d_{n+1})$","(5) 對所有正整數 $n\\geq 2$，$b_n=a_{n-1}$"],"answer":"(2)(5)","explanation":["先算 $A^2$：$c_{11}=(3)(3)+(1)(1)=10$，$c_{12}=(3)(1)+(1)(0)=3$，$c_{21}=(1)(3)+(0)(1)=3$，$c_{22}=(1)(1)+(0)(0)=1$。故 $a_2=10$、$b_2=3$、$c_2=3$、$d_2=1$。","(1) $b_2=3=c_2$，故 $b_2<c_2$ 不成立。","(2) $3A+I=[[10,3;3,1]]$，等於 $A^2$。正確。","(3) 由 (2) 兩邊同乘 $A^n$ 得 $A^{n+2}=3A^{n+1}+A^n$，故 $c_{n+2}=3c_{n+1}+c_n$，選項少了係數 $3$。","(4) $A^n$ 將 $(1,1)$ 映射為 $(a_n+b_n,c_n+d_n)$。$n=1$ 時為 $(4,1)$，而 $(b_2,d_2)=(3,1)$，不相等。","(5) $A^n=A^{n-1}A$，右乘 $A$ 得 $b_n=a_{n-1}$（第一列第二行等於前一冪第一列第一行）。正確。","觀念回顧：方陣滿足凱萊－漢米爾頓定理（$A^2-(trA)A+(\\det A)I=0$）；矩陣冪的元素有遞迴關係。"],"hasFigure":true},{"id":"u14b_1","unit":"十四","chapter":"矩陣","track":"B","source":"110 試辦數 B 第 2 題","concept":"矩陣的階與乘法","stem":"若 $m\\times n$ 階矩陣 $B$ 滿足下列等式（等號左邊為直式向量 $[[2;1;0;-1;3]]$，等號右邊為矩陣 $B$ 乘以直式向量 $[[4;5;2;-3]]$），則數對 $(m,n)$ 為下列哪一個選項？等式：$[[2;1;0;-1;3]]=B[[4;5;2;-3]]$（向量皆寫成直式）","options":["(1) $(4,5)$","(2) $(5,4)$","(3) $(4,4)$","(4) $(5,5)$","(5) $(3,5)$"],"answer":"(2)","explanation":["直式向量 $[[4;5;2;-3]]$ 有 $4$ 個分量，故矩陣 $B$ 的行數必須是 $4$，才能與之相乘。","乘積結果 $[[2;1;0;-1;3]]$ 有 $5$ 個分量，故矩陣 $B$ 的列數是 $5$。","因此 $B$ 為 $5\\times 4$ 階矩陣，$(m,n)=(5,4)$。","觀念回顧：$(m\\times n$ 階矩陣$)\\times(n\\times 1$ 直式向量$)=m\\times 1$ 直式向量。"],"hasFigure":false},{"id":"u14b_2","unit":"十四","chapter":"矩陣","track":"B","source":"110 試辦數 B 第 8 題","concept":"矩陣乘法與數列遞迴","stem":"已知實數數列 $a_n$、$b_n$、$c_n$、$d_n$（$n\\geq 1$，且 $a_1$、$b_1$、$c_1$、$d_1$ 皆不為零）滿足下列兩式：直式向量 $[[a_{n+1};b_{n+1}]]$ 等於矩陣 $M=[[1,0;0,2]]$ 乘以直式向量 $[[a_n;b_n]]$ 再加上直式向量 $[[4;0]]$；直式向量 $[[c_n;d_n]]$ 等於矩陣 $N=[[2,1;3,0]]$ 乘以直式向量 $[[a_n;b_n]]$。試選出正確的選項。","options":["(1) 數列 $a_n$ 為等比數列","(2) 數列 $b_n$ 為等差數列","(3) 數列 $c_n$ 為等比數列","(4) 數列 $d_n$ 為等差數列","(5) 對任何正整數 $n$，$d_n>a_n$"],"answer":"(4)","explanation":["將矩陣乘法展開：得聯立方程式：$a_{n+1}=a_n+4$，$b_{n+1}=2b_n$；$c_n=2a_n+b_n$，$d_n=3a_n$。","由 $a_{n+1}=a_n+4$ 知 $a_n$ 為公差 $4$ 的等差數列，(1) 錯。","由 $b_{n+1}=2b_n$ 知 $b_n$ 為公比 $2$ 的等比數列，(2) 錯。","$c_n=2a_n+b_n$ 為等差數列與等比數列的和，既非等差亦非等比，(3) 錯。","$d_n=3a_n$ 為公差 $12$ 的等差數列，(4) 正確。","(5) 中 $d_n>a_n$ 等價於 $3a_n>a_n$，即 $a_n>0$，不一定成立，故 (5) 錯。","觀念回顧：由遞迴關係式判斷等差（後項減前項為定值）或等比（後項除以前項為定值）。"],"hasFigure":true},{"id":"u14b_3","unit":"十四","chapter":"矩陣","track":"B","source":"111 學測數 B 第 5 題","concept":"矩陣乘冪","stem":"設二階方陣 $A=[[1,2;2,-1]]$。若 $A^5-4A=[[a,b;c,d]]$，則 $a+b+c+d$ 的值為下列哪一個選項？","options":["(1) 80","(2) 82","(3) 84","(4) 86","(5) 88"],"answer":"(3)","explanation":["先算 $A^2$：$c_{11}=(1)(1)+(2)(2)=5$，$c_{12}=(1)(2)+(2)(-1)=0$，$c_{21}=(2)(1)+(-1)(2)=0$，$c_{22}=(2)(2)+(-1)(-1)=5$。故 $A^2=5I$（$I$ 為單位方陣）。","於是 $A^4=25I$，$A^5=25A$，得 $A^5-4A=21A$。","$21A=[[21,42;42,-21]]$，故 $a+b+c+d=21+42+42-21=84$。","觀念回顧：若 $A^2=kI$，則 $A$ 的高次方可由 $k$ 的次方乘上 $A$ 或 $I$ 化簡。"],"hasFigure":true},{"id":"u14b_4","unit":"十四","chapter":"矩陣","track":"B","source":"111 參考數 B 第 16 題","concept":"二階反方陣","stem":"設二階方陣 $A=[[4,1;-1,x]]$，二階方陣 $B=[[4,-1;1,x]]$，其中 $x$ 為實數。已知 $A$ 的反方陣恰好是 $B$ 的 $c$ 倍，則數對 $(x,c)=$________。","options":[],"answer":"(4,1/17)","explanation":["$A$ 的行列式為 $4x+1$，由二階反方陣公式得 $A$ 的反方陣為 $\\frac{1}{4x+1}[[x,-1;1,4]]$。","依題意此即 $cB$，比較對應分量得 $\\frac{1}{4x+1}=c$ 且 $\\frac{x}{4x+1}=4c$，解得 $x=4$，$c=\\frac{1}{17}$。","觀念回顧：二階方陣 $[[a,b;c,d]]$ 的反方陣為 $\\frac{1}{ad-bc}[[d,-b;-c,a]]$（行列式不為零時）。"],"hasFigure":false},{"id":"u14b_5","unit":"十四","chapter":"矩陣","track":"B","source":"112 學測數 B 第 2 題","concept":"矩陣乘法","stem":"考慮實數二階方陣 $[[a,b;c,d]]$。若矩陣 $P=[[0,1;1,0]]$ 與矩陣 $Q=[[1,2;3,1]]$ 的乘積，再乘以該二階方陣，等於矩陣 $R=[[7,11;4,7]]$，則 $2c-b$ 的值為何？即 $PQ[[a,b;c,d]]=[[7,11;4,7]]$。","options":["(1) $-3$","(2) $-1$","(3) 1","(4) 3","(5) 5"],"answer":"(2)","explanation":["先算 $PQ$：$c_{11}=(0)(1)+(1)(3)=3$，$c_{12}=(0)(2)+(1)(1)=1$，$c_{21}=(1)(1)+(0)(3)=1$，$c_{22}=(1)(2)+(0)(1)=2$，故 $PQ=[[3,1;1,2]]$。","設 $S=PQ$，則 $S$ 乘以 $[[a,b;c,d]]$ 展開得 $3a+c=7$、$a+2c=4$，解得 $a=2$、$c=1$；$3b+d=11$、$b+2d=7$，解得 $b=3$、$d=2$。","故 $2c-b=2-3=-1$。","觀念回顧：矩陣乘法先算左邊的乘積，再與未知矩陣相乘展開成聯立方程式求解。"],"hasFigure":true},{"id":"u14b_6","unit":"十四","chapter":"矩陣","track":"B","source":"113 學測數 B 第 12 題","concept":"轉移矩陣與機率（馬可夫鏈）","stem":"小明寫了一個程式讓機器人在 $2\\times 2$ 的棋盤中移動，如圖所示。每執行一次，程式會選擇「上、下、左、右」中的某一個方向，不同方向被選擇的機率均相等，並指示機器人依該方向移動一格，但若選到的方向會跑出棋盤，則機器人該次會停在原地。每次執行都是從上次所在位置依程式重新選取的方向移動，假設機器人的初始位置在 $A$。令執行程式 $n$ 次後，機器人停留在 $A$、$B$、$C$、$D$ 的機率分別為 $a_n$、$b_n$、$c_n$ 和 $d_n$。試選出正確的選項。（圖：$2\\times 2$ 棋盤，$A$ 左上、$B$ 右上、$C$ 左下、$D$ 右下）","options":["(1) $c_1=\\frac{1}{4}$","(2) $a_2=\\frac{1}{2}$","(3) $b_3=\\frac{1}{4}$","(4) $b_{50}=c_{50}$","(5) $a_{100}+d_{100}>\\frac{1}{2}$"],"answer":"(1)(3)(4)","explanation":["棋盤配置為 $A$ 左上、$B$ 右上、$C$ 左下、$D$ 右下。由對稱性（$B$、$C$ 皆為 $A$ 的鄰格），$b_n=c_n$ 恆成立。","(1) $c_1$ 為一次到 $C$，須選「下」，機率 $\\frac{1}{4}$，正確。","(2) $a_2=\\frac{1}{4}+\\frac{1}{16}+\\frac{1}{16}=\\frac{3}{8}$（路線 $A\\to A\\to A$、$A\\to B\\to A$、$A\\to C\\to A$），故 (2) 錯。","(3) 由轉移關係逐次計算可得 $b_3=\\frac{1}{4}$，正確。","(4) 由對稱性 $b_n=c_n$ 對一切 $n$ 成立，故 $b_{50}=c_{50}$，正確。","(5) $b_n+c_n=\\frac{1}{2}$ 恆成立，故 $a_n+d_n=\\frac{1}{2}$，(5) 錯。","觀念回顧：轉移矩陣（馬可夫鏈）中，利用對稱性簡化計算；機率總和恆為 $1$。"],"hasFigure":true},{"id":"u14b_7","unit":"十四","chapter":"矩陣","track":"B","source":"113 學測數 B 第 13 題","concept":"矩陣方程式與聯立方程式","stem":"已知 $a$、$b$、$c$、$d$ 為實數，且矩陣 $M=[[1,2;3,-1]]$ 乘以直式向量 $[[a;b]]$ 等於直式向量 $[[4;5]]$；矩陣 $N=[[2,1;1,1]]$ 乘以二階方陣 $[[a,b;c,d]]$，等於二階方陣 $[[5,5;3,4]]$。則 $2c+d$ 的值為________。","options":[],"answer":"5","explanation":["由第一式：$c_{11}=(1)(a)+(2)(b)=4$，$c_{21}=(3)(a)+(-1)(b)=5$。由第一式展開得 $a+2b=4$、$3a-b=5$，解得 $a=2$、$b=1$。","由第二式：$c_{11}=(2)(a)+(1)(c)=5$，$c_{12}=(2)(b)+(1)(d)=5$，$c_{21}=(1)(a)+(1)(c)=3$，$c_{22}=(1)(b)+(1)(d)=4$。由第二式展開得 $2a+c=5$、$2b+d=5$、$a+c=3$、$b+d=4$，代入 $a=2$、$b=1$ 得 $c=1$、$d=3$。","故 $2c+d=2+3=5$。","觀念回顧：矩陣方程式展開成聯立方程式，逐步求解未知數。"],"hasFigure":true},{"id":"u14b_8","unit":"十四","chapter":"矩陣","track":"B","source":"114 學測數 B 第 2 題","concept":"矩陣乘法分配律與線性組合","stem":"設 $A$ 為 $3\\times 2$ 階矩陣，且 $A$ 乘以直式向量 $[[2;1]]$ 等於直式向量 $[[5;3;4]]$，$A$ 乘以直式向量 $[[1;1]]$ 等於直式向量 $[[3;1;1]]$。若 $A$ 乘以直式向量 $[[1;0]]$ 等於直式向量 $[[a;b;c]]$，試問 $a+b+c$ 的值為何？","options":["(1) 5","(2) 6","(3) 7","(4) 8","(5) 9"],"answer":"(3)","explanation":["將兩式相減：$A[[2;1]]-A[[1;1]]=A[[1;0]]$，故 $[[a;b;c]]=[[5;3;4]]-[[3;1;1]]=[[2;2;3]]$。","因此 $a+b+c=2+2+3=7$。","觀念回顧：矩陣乘法對向量加減法有分配律，可用線性組合求未知的作用結果。"],"hasFigure":false},{"id":"u14b_9","unit":"十四","chapter":"矩陣","track":"B","source":"115 學測數 B 第 3 題","concept":"二階反方陣","stem":"已知實數二階方陣 $A$ 滿足：$A$ 乘以直式向量 $[[1;0]]$ 等於直式向量 $[[2;1]]$，且 $A$ 乘以直式向量 $[[0;1]]$ 等於直式向量 $[[1;1]]$。試選出 $A$ 的反方陣。$A$ 的反方陣為下列哪一個選項？","options":["(1) $[[0,1;1,0]]$","(2) $[[1,-1;-1,2]]$","(3) $[[1,1;-1,2]]$","(4) $[[2,-1;-1,1]]$","(5) $[[-1,1;1,-2]]$"],"answer":"(2)","explanation":["由 $A[[1;0]]=[[2;1]]$ 知 $A$ 的第一行（直式）為 $[[2;1]]$；由 $A[[0;1]]=[[1;1]]$ 知 $A$ 的第二行（直式）為 $[[1;1]]$。故 $A=[[2,1;1,1]]$。","$A$ 的行列式為 $2\\times 1-1\\times 1=1$，由二階反方陣公式得反方陣為 $[[1,-1;-1,2]]$。","觀念回顧：$A$ 乘以基本行向量即得 $A$ 的行；二階反方陣公式為行列式分之一乘以對角交換、非對角變號。"],"hasFigure":false}];

/* ---------- localStorage ---------- */
function loadJSON(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
var records = loadJSON(REC_KEY, {});   // id -> {done:true, correct:bool}
var wrongIds = loadJSON(WRONG_KEY, []); // [id]

function byId(id) {

  return null;
}

}
function renderRich(el, text) {
  var parts = String(text).split("$");
  var html = "";
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      try {
        html += katex.renderToString(parts[i], { throwOnError: false });
      } catch (e) {
        html += escapeHTML(parts[i]);
      }
    } else {
      html += escapeHTML(parts[i]);
    }
  }
  el.innerHTML = html;
}

/* ---------- 答案解析 ---------- */
function answerNums(q) {
  var m = q.answer.match(/\(\s*\d+\s*\)/g) || [];
  return m.map(function (s) { return parseInt(s.replace(/\D/g, ""), 10); });
}
function optionNum(optText) {
  var m = String(optText).match(/^\(\s*(\d+)\s*\)/);
  return m ? parseInt(m[1], 10) : null;
}
function optionBody(optText) {
  return String(optText).replace(/^\(\s*\d+\s*\)\s*/, "");
}

/* ---------- 視圖切換 ---------- */
var views = ["home", "practice", "result", "wrong"];
function show(name) {
  views.forEach(function (v) {
    document.getElementById("view-" + v).classList.toggle("active", v === name);
  });
  window.scrollTo(0, 0);
}

/* ---------- 首頁 ---------- */
function groups() {
  var seen = [], map = {};
  QUESTIONS.forEach(function (q) {
    var key = q.unit + "|" + q.track;
    if (!map[key]) { map[key] = { unit: q.unit, track: q.track, items: [] }; seen.push(map[key]); }
    map[key].items.push(q);
  });
  return seen;
}
function renderHome() {
  var total = QUESTIONS.length, done = 0, correct = 0;
  QUESTIONS.forEach(function (q) {
    var r = records[q.id];
    if (r && r.done) { done++; if (r.correct) correct++; }
  });
  document.getElementById("total-count").textContent = total;
  document.getElementById("stat-done").textContent = done;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-acc").textContent = done ? Math.round(correct / done * 100) + "%" : "—";
  document.getElementById("stat-bar").style.width = (total ? (done / total * 100) : 0) + "%";
  document.getElementById("wrong-count").textContent = wrongIds.length ? "（" + wrongIds.length + " 題）" : "（目前 0 題）";

  var list = document.getElementById("group-list");
  list.innerHTML = "";
  var byUnit = {};
  groups().forEach(function (g) {
    if (!byUnit[g.unit]) byUnit[g.unit] = [];
    byUnit[g.unit].push(g);
  });
  UNIT_ORDER.forEach(function (unit) {
    var unitGroups = byUnit[unit];
    if (!unitGroups) return;
    unitGroups.sort(function (a, b) { return a.track < b.track ? -1 : 1; });
    var card = document.createElement("div");
    card.className = "card";
    var ctitle = document.createElement("div");
    ctitle.className = "chapter-title";
    ctitle.textContent = "第" + unit + "單元 " + (UNIT_NAMES[unit] || "");
    card.appendChild(ctitle);
    unitGroups.forEach(function (g) {
      var gDone = g.items.filter(function (q) { return records[q.id] && records[q.id].done; }).length;
      var row = document.createElement("div");
      row.className = "track-row";
      var grow = document.createElement("div");
      grow.className = "grow";
      var title = document.createElement("div");
      title.className = "group-title";
      var track = document.createElement("span");
      track.className = "track" + (g.track === "B" ? " b" : "");
      track.style.marginLeft = "0";
      track.textContent = "數學" + g.track;
      title.appendChild(track);
      var meta = document.createElement("div");
      meta.className = "group-meta";
      meta.textContent = "共 " + g.items.length + " 題・已練 " + gDone + " 題";
      grow.appendChild(title); grow.appendChild(meta);
      var btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = gDone ? "繼續練習" : "開始練習";
      btn.addEventListener("click", function () { startPractice(g.items.map(function (q) { return q.id; })); });
      row.appendChild(grow); row.appendChild(btn);
      card.appendChild(row);
    });
    list.appendChild(card);
  });
}

/* ---------- 練習 ---------- */
var session = null; // {ids:[], idx:0, selected:{}, submitted:false, score:0}

function startPractice(ids) {
  if (!ids.length) return;
  session = { ids: ids.slice(), idx: 0, selected: {}, submitted: false, score: 0 };
  show("practice");
  renderQuestion();
}

function renderQuestion() {
  var q = byId(session.ids[session.idx]);
  var total = session.ids.length;
  document.getElementById("q-progress").textContent = "第 " + (session.idx + 1) + " / " + total + " 題";
  document.getElementById("q-bar").style.width = ((session.idx) / total * 100) + "%";

  var tags = document.getElementById("q-tags");
  tags.innerHTML = "";
  [q.source, "觀念：" + q.concept].forEach(function (t) {
    var s = document.createElement("span"); s.className = "tag"; s.textContent = t; tags.appendChild(s);
  });
  var isFill = q.options.length === 0;
  var multi = !isFill && answerNums(q).length > 1;
  var kind = document.createElement("span");
  kind.className = "tag kind";
  kind.textContent = isFill ? "選填題" : (multi ? "多選題（可複選）" : "單選題");
  tags.appendChild(kind);

  var figBlock = document.getElementById("q-fig");
  var figImg = document.getElementById("q-fig-img");
  if (q.hasFigure) {
    figImg.src = "assets/fig/" + q.id + "_q.webp";
    figBlock.style.display = "";
  } else {
    figImg.removeAttribute("src");
    figBlock.style.display = "none";
  }

  renderRich(document.getElementById("q-stem"), q.stem);

  session.selected = {};
  session.submitted = false;
  var box = document.getElementById("q-options");
  box.innerHTML = "";
  q.options.forEach(function (opt) {
    var n = optionNum(opt);
    var b = document.createElement("button");
    b.className = "opt" + (multi ? " multi" : "");
    b.type = "button";
    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "✓";
    var body = document.createElement("span");
    var label = document.createElement("b");
    label.textContent = "(" + n + ") ";
    body.appendChild(label);
    var txt = document.createElement("span");
    renderRich(txt, optionBody(opt));
    body.appendChild(txt);
    b.appendChild(mark); b.appendChild(body);
    b.addEventListener("click", function () {
      if (session.submitted) return;
      if (multi) {
        if (session.selected[n]) delete session.selected[n]; else session.selected[n] = true;
      } else {
        session.selected = {}; session.selected[n] = true;
      }
      refreshOptions();
    });
    b.dataset.num = n;
    box.appendChild(b);
  });

  var fillWrap = document.getElementById("q-fill-wrap");
  var fillInput = document.getElementById("q-fill-input");
  box.style.display = isFill ? "none" : "";
  fillWrap.style.display = isFill ? "" : "none";
  if (isFill) {
    fillInput.value = "";
    fillInput.disabled = false;
    fillInput.className = "fill-input";
    fillInput.oninput = function () {
      if (!session.submitted) document.getElementById("btn-submit").disabled = fillInput.value.trim() === "";
    };
    fillInput.onkeydown = function (e) {
      if (e.key === "Enter" && !document.getElementById("btn-submit").disabled) submitAnswer();
    };
  }

  var fb = document.getElementById("q-feedback");
  fb.className = "feedback"; fb.innerHTML = "";
  document.getElementById("q-explain").classList.remove("show");
  var submit = document.getElementById("btn-submit");
  submit.style.display = ""; submit.disabled = true;
  var next = document.getElementById("btn-next");
  next.style.display = "none";
  next.textContent = session.idx === total - 1 ? "看成績" : "下一題";
}

function refreshOptions() {
  var btns = document.getElementById("q-options").children;
  for (var i = 0; i < btns.length; i++) {
    var n = parseInt(btns[i].dataset.num, 10);
    btns[i].classList.toggle("selected", !!session.selected[n]);
  }
  document.getElementById("btn-submit").disabled = Object.keys(session.selected).length === 0;
}

function normalizeAns(s) {
  return String(s == null ? "" : s)
    .replace(/[\s\u3000]+/g, "")
    .replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[\u2212\u2013\u2014]/g, "-")
    .replace(/\u00B2/g, "^2")
    .replace(/\u00B3/g, "^3");
}

function submitAnswer() {
  if (!session || session.submitted) return;
  var q = byId(session.ids[session.idx]);
  var isFill = q.options.length === 0;
  var ans = answerNums(q);
  var ok;
  if (isFill) {
    var userNorm = normalizeAns(document.getElementById("q-fill-input").value);
    ok = userNorm !== "" && userNorm === normalizeAns(q.answer);
  } else {
    var picked = Object.keys(session.selected).map(function (k) { return parseInt(k, 10); }).sort(function (a, b) { return a - b; });
    var sortedAns = ans.slice().sort(function (a, b) { return a - b; });
    ok = picked.length === sortedAns.length && picked.every(function (v, i) { return v === sortedAns[i]; });
  }
  session.submitted = true;
  if (ok) session.score++;

  // 紀錄 + 錯題本
  records[q.id] = { done: true, correct: ok };
  saveJSON(REC_KEY, records);
  var wi = wrongIds.indexOf(q.id);
  if (!ok && wi === -1) { wrongIds.push(q.id); saveJSON(WRONG_KEY, wrongIds); }
  if (ok && wi !== -1) { wrongIds.splice(wi, 1); saveJSON(WRONG_KEY, wrongIds); }

  if (isFill) {
    var inp = document.getElementById("q-fill-input");
    inp.disabled = true;
    inp.classList.add(ok ? "correct" : "wrong");
  } else {
    // 選項上色
    var btns = document.getElementById("q-options").children;
    for (var i = 0; i < btns.length; i++) {
      var n = parseInt(btns[i].dataset.num, 10);
      btns[i].classList.add("locked");
      btns[i].classList.remove("selected");
      if (ans.indexOf(n) !== -1) btns[i].classList.add("correct");
      else if (session.selected[n]) btns[i].classList.add("wrongpick");
    }
  }

  var fb = document.getElementById("q-feedback");
  fb.className = "feedback " + (ok ? "ok" : "no");
  fb.textContent = ok ? "答對了！" : "答錯了。";
  if (!ok || isFill) {
    var ca = document.createElement("span");
    ca.className = "correct-ans";
    ca.textContent = "正確答案：" + q.answer;
    fb.appendChild(ca);
  }

  var body = document.getElementById("q-explain-body");
  body.innerHTML = "";
  q.explanation.forEach(function (para) {
    var p = document.createElement("p");
    renderRich(p, para);
    body.appendChild(p);
  });
  if (q.hasFigure) {
    var figLabel = document.createElement("div");
    figLabel.className = "fig-label";
    figLabel.textContent = "詳解圖卡";
    var solImg = document.createElement("img");
    solImg.className = "fig-img";
    solImg.alt = "本題詳解圖卡";
    solImg.src = "assets/fig/" + q.id + "_s.webp";
    solImg.addEventListener("click", function () { openLightbox(solImg.src); });
    body.appendChild(figLabel);
    body.appendChild(solImg);
  }
  document.getElementById("q-explain").classList.add("show");

  document.getElementById("btn-submit").style.display = "none";
  document.getElementById("btn-next").style.display = "";
  document.getElementById("q-bar").style.width = ((session.idx + 1) / session.ids.length * 100) + "%";
}

function nextQuestion() {
  if (session.idx < session.ids.length - 1) {
    session.idx++;
    renderQuestion();
  } else {
    document.getElementById("r-score").textContent = session.score;
    document.getElementById("r-total").textContent = session.ids.length;
    var total = session.ids.length, s = session.score;
    var msg = s === total ? "全對，太厲害了！" :
              s / total >= 0.6 ? "答對 " + s + " 題，答錯的題目已收進錯題本，記得去複習。" :
              "答對 " + s + " 題，先到錯題本把詳解看懂，再重練一次。";
    document.getElementById("r-msg").textContent = msg;
    show("result");
  }
}

/* ---------- 錯題本 ---------- */
function renderWrong() {
  document.getElementById("wrong-progress").textContent = "共 " + wrongIds.length + " 題";
  document.getElementById("btn-retry-wrong").disabled = wrongIds.length === 0;
  var list = document.getElementById("wrong-list");
  list.innerHTML = "";
  if (!wrongIds.length) {
    var empty = document.createElement("div");
    empty.className = "card empty";
    empty.textContent = "目前沒有錯題，繼續保持！";
    list.appendChild(empty);
    return;
  }
  wrongIds.slice().forEach(function (id) {
    var q = byId(id);
    if (!q) return;
    var card = document.createElement("div");
    card.className = "card wrong-item";

    var tags = document.createElement("div");
    tags.className = "tags";
    ["第" + q.unit + "單元 " + (UNIT_NAMES[q.unit] || "") + "・數學" + q.track, q.source, "觀念：" + q.concept].forEach(function (t) {
      var s = document.createElement("span"); s.className = "tag"; s.textContent = t; tags.appendChild(s);
    });
    card.appendChild(tags);

    var head = document.createElement("div");
    head.className = "wrong-item-head";
    var stem = document.createElement("div");
    stem.className = "stem";
    renderRich(stem, q.stem);
    var rm = document.createElement("button");
    rm.className = "remove-btn";
    rm.textContent = "移除";
    rm.addEventListener("click", function () {
      wrongIds = wrongIds.filter(function (x) { return x !== id; });
      saveJSON(WRONG_KEY, wrongIds);
      renderWrong();
    });
    head.appendChild(stem); head.appendChild(rm);
    card.appendChild(head);

    var ansLine = document.createElement("div");
    ansLine.className = "ans-line";
    var ansLabel = document.createTextNode("正確答案：");
    var ansB = document.createElement("b");
    ansB.textContent = q.answer;
    ansLine.appendChild(ansLabel); ansLine.appendChild(ansB);
    card.appendChild(ansLine);

    var toggle = document.createElement("button");
    toggle.className = "toggle-btn";
    toggle.textContent = "看詳解 ▾";
    var ex = document.createElement("div");
    ex.className = "explain";
    var h = document.createElement("h3"); h.textContent = "詳解"; ex.appendChild(h);
    q.explanation.forEach(function (para) {
      var p = document.createElement("p");
      renderRich(p, para);
      ex.appendChild(p);
    });
    toggle.addEventListener("click", function () {
      var open = ex.classList.toggle("show");
      toggle.textContent = open ? "收起詳解 ▴" : "看詳解 ▾";
    });
    card.appendChild(toggle);
    card.appendChild(ex);
    list.appendChild(card);
  });
}

/* ---------- 圖卡放大檢視 ---------- */
function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-img").removeAttribute("src");
}
document.getElementById("q-fig-img").addEventListener("click", function () {
  if (this.getAttribute("src")) openLightbox(this.src);
});
document.getElementById("lightbox").addEventListener("click", closeLightbox);
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);

/* ---------- 事件綁定 ---------- */
document.getElementById("btn-submit").addEventListener("click", submitAnswer);
document.getElementById("btn-next").addEventListener("click", nextQuestion);
document.getElementById("btn-quit").addEventListener("click", function () { renderHome(); show("home"); });
document.getElementById("btn-open-wrong").addEventListener("click", function () { renderWrong(); show("wrong"); });
document.getElementById("btn-wrong-home").addEventListener("click", function () { renderHome(); show("home"); });
document.getElementById("btn-result-home").addEventListener("click", function () { renderHome(); show("home"); });
document.getElementById("btn-result-retry").addEventListener("click", function () { if (session) startPractice(session.ids); });
document.getElementById("btn-retry-wrong").addEventListener("click", function () { startPractice(wrongIds); });

/* ---------- PWA：安裝提示橫幅 ---------- */
var HINT_KEY = "qbank_install_hint_v1";
(function () {
  var banner = document.getElementById("install-banner");
  var btnInstall = document.getElementById("btn-install");
  var iosHint = document.getElementById("install-ios-hint");
  var dismissed = false;
  try { dismissed = localStorage.getItem(HINT_KEY) === "dismissed"; } catch (e) {}
  var standalone = false;
  try {
    standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  } catch (e) {}
  if (dismissed || standalone) return;

  var ua = window.navigator.userAgent || "";
  var isIOS = /iphone|ipad|ipod/i.test(ua) ||
    (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);
  if (isIOS) iosHint.hidden = false;

  function refreshInstallBtn() {
    if (window.__bipEvent) btnInstall.hidden = false;
  }
  window.__onBipReady = refreshInstallBtn;
  refreshInstallBtn();
  banner.hidden = false;

  btnInstall.addEventListener("click", function () {
    var ev = window.__bipEvent;
    if (!ev) return;
    window.__bipEvent = null;
    btnInstall.hidden = true;
    ev.prompt();
    if (ev.userChoice) {
      ev.userChoice.then(function () { banner.hidden = true; });
    }
  });
  window.addEventListener("appinstalled", function () { banner.hidden = true; });
  document.getElementById("btn-install-close").addEventListener("click", function () {
    banner.hidden = true;
    try { localStorage.setItem(HINT_KEY, "dismissed"); } catch (e) {}
  });
})();

/* ---------- PWA：註冊 Service Worker（離線快取） ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* 無法註冊時維持一般線上使用 */ });
  });
}

renderHome();
</script>
