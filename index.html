14$ 種可能。","$8$ 種壽司互相獨立，故總組合數為 $14^8$。","觀念回顧：從「會用掉」的物件著手分析；注意排除不可能與不合條件的情況。"],"hasFigure":false},{"id":"u5a_2","unit":"五","chapter":"排列組合與機率","track":"A","source":"110 試辦學科能力測驗 數學A","concept":"條件機率與期望值","stem":"某公司舉辦抽獎活動，發出編號 $001$ 到 $600$ 共 $600$ 張彩券。抽獎方式為先由 $0$ 到 $9$ 共十個數字中隨機抽出一個作為中獎號碼的百位數字，再依同樣方式抽出十位數字與個位數字。每次抽數字皆不受前面已抽結果影響，且 $0\\sim 9$ 任一數被抽出的機率皆為 $\\frac{1}{10}$。如果抽出的號碼不在 $001\\sim 600$ 之間，則依前述方式重新再抽三個數字作為中獎號碼；若連續三輪都抽不出中獎號碼，則此抽獎活動無人中獎。試選出正確的選項。","options":["(1) $123$ 號與 $321$ 號中獎機率相同","(2) 每個號碼中獎機率皆為 $\\frac{1}{600}$","(3) 若有人中獎，則此中獎號碼的百位數字為 $1$ 與百位數字為 $6$ 的機率相同","(4) 抽到第三輪且有人中獎的機率大於 $5\\%$","(5) 此抽獎活動有人中獎的機率小於 $93\\%$"],"answer":"(1)(4)","explanation":["每輪抽出 $000\\sim 999$ 共 $1000$ 種等可能結果，落在 $001\\sim 600$ 的機率為 $\\frac{600}{1000}=0.6$，無效機率為 $0.4$。","(1) 由對稱性，任兩個有效號碼的中獎機率相同，正確；","(2) 實際中獎機率 $=\\frac{1}{1000}(1+0.4+0.4^2)=0.00156\\neq\\frac{1}{600}$，錯誤；","(3) 百位為 $1$ 的有效號碼有 $100$ 個（$100\\sim 199$），百位為 $6$ 的只有 $1$ 個（$600$），機率不同，錯誤；","(4) 前兩輪無效且第三輪有效：$0.4^2\\times 0.6=0.096>0.05$，正確；","(5) 有人中獎 $=1-0.4^3=0.936>0.93$，錯誤。","觀念回顧：重複試驗用乘法原理；「至少一次」用餘事件 $1-P$（皆無）計算。"],"hasFigure":false},{"id":"u5a_3","unit":"五","chapter":"排列組合與機率","track":"A","source":"111 學年度學科能力測驗 數學A","concept":"組合數與重複組合","stem":"某冰淇淋店最少需準備 $n$ 桶不同口味的冰淇淋，才能滿足廣告所稱「任選兩球不同口味冰淇淋的組合數超過 $150$ 種」。試問來店顧客從 $n$ 桶中任選兩球（可為同一口味）共有幾種方法？","options":["(1) $153$","(2) $162$","(3) $171$","(4) $180$","(5) $190$"],"answer":"(3)","explanation":["任選兩球不同口味有 $C_{2}^{n}=\\frac{n(n-1)}{2}$ 種。由 $\\frac{n(n-1)}{2}>150$ 得 $n^2-n-300>0$，解得 $n>17.8$，故最小整數 $n=18$。","任選兩球可為同一口味，屬重複組合：$H_{2}^{18}=C_{2}^{18+2-1}=C_{2}^{19}=\\frac{19\\times 18}{2}=171$。","觀念回顧：相異物取 $r$ 個：$C_{r}^{n}$；可重複取 $r$ 個：$H_{r}^{n}=C_{r}^{n+r-1}$。"],"hasFigure":false},{"id":"u5a_4","unit":"五","chapter":"排列組合與機率","track":"A","source":"111 學年度學科能力測驗 數學A","concept":"期望值","stem":"有一款線上遊戲推出「十連抽」的抽卡機制，「十連抽」意思為系統自動做十次的抽卡動作。若每次「十連抽」需用 $1000$ 枚代幣，抽中金卡的機率在前九次皆為 $3\\%$，在第十次為 $12\\%$。今某生有代幣 $25000$ 枚，且不斷使用「十連抽」，抽到不能再抽為止。則某生抽到金卡張數的期望值為______張。","options":[],"answer":"9.75","explanation":["$25000$ 枚代幣可進行 $\\frac{25000}{1000}=25$ 次十連抽。","每次十連抽中，前九次每次金卡期望值 $0.03$ 張，第十次 $0.12$ 張，故一次十連抽的期望值為 $9\\times 0.03+0.12=0.39$ 張。","$25$ 次的總期望值為 $25\\times 0.39=9.75$ 張。","觀念回顧：期望值的線性性質：$E(X_1+\\cdots+X_n)=E(X_1)+\\cdots+E(X_n)$，不需獨立。"],"hasFigure":false},{"id":"u5a_5","unit":"五","chapter":"排列組合與機率","track":"A","source":"111 學年度參考試卷 數學A","concept":"期望值","stem":"某實驗有 $8$ 件血液樣本，將其混合成一組樣本作一次檢驗。假設每件血液樣本檢驗呈陽性的機率都是 $0.2$，且只要有一件血液樣本呈陽性反應，其混合的樣本也會呈陽性反應。當混合的樣本檢驗結果呈陰性反應時，只要一次檢驗即可；當混合的樣本檢驗結果呈陽性反應時，就必須重新將這 $8$ 件血液樣本逐一檢驗，此情況下總共需要 $9$ 次檢驗。依此檢驗方式，這 $8$ 件血液樣本檢驗次數之期望值為何？","options":["(1) $8\\times 0.8^8$","(2) $9\\times 0.8^8$","(3) $9-8\\times 0.8^8$","(4) $1+8\\times 0.8^8$","(5) $9\\times(1-0.8^8)$"],"answer":"(3)","explanation":["檢驗次數只有兩種可能：$1$ 次或 $9$ 次。","只需 $1$ 次的情形是 $8$ 件全為陰性，機率為 $0.8^8$；其餘情形都需 $9$ 次，機率為 $1-0.8^8$。","期望值 $=1\\times 0.8^8+9\\times(1-0.8^8)=9-8\\times 0.8^8$。","觀念回顧：期望值 $=\\sum x_i\\cdot P(X=x_i)$；混合檢驗省次數的關鍵是「全陰性」的高機率。"],"hasFigure":false},{"id":"u5a_6","unit":"五","chapter":"排列組合與機率","track":"A","source":"111 學年度參考試卷 數學A","concept":"分類計數","stem":"一個滑板是由 $1$ 個踏板、$1$ 個輪架及 $2$ 組相同品牌的滑輪組合而成。某滑板店提供 $4$ 種不同品牌的踏板（單價 $200$、$300$、$400$、$500$ 元）、$1$ 種輪架（單價 $1000$ 元）及 $2$ 種不同品牌的滑輪（單價 $500$、$600$ 元／組），讓顧客自由選擇搭配。今欲組裝一個不超過 $2800$ 元的滑板，共有______種搭配方式。","options":[],"answer":"8","explanation":["輪架固定花費 $1000$ 元，剩餘預算 $1800$ 元。","若滑輪選 $500$ 元／組：$2$ 組共 $1000$ 元，剩 $800$ 元，$4$ 種踏板（$200\\sim 500$ 元）皆可負擔，有 $4$ 種搭配；","若滑輪選 $600$ 元／組：$2$ 組共 $1200$ 元，剩 $600$ 元，$4$ 種踏板皆可負擔，有 $4$ 種搭配。","總計 $4+4=8$ 種搭配方式。","觀念回顧：分類討論：先固定高單價零件，再依預算枚舉可行組合。"],"hasFigure":false},{"id":"u5a_7","unit":"五","chapter":"排列組合與機率","track":"A","source":"111 學年度參考試卷 數學A","concept":"古典機率","stem":"有一新型「打地鼠」遊戲機，機台上有 $36$ 個洞，分別標示整數坐標（格子點）$(0,0)$、$(0,1)$、$\\cdots$、$(5,5)$。老闆將這 $36$ 個格子點各作成一支籤放置於籤筒。每位遊戲者從籤筒中同時抽出兩支籤，並依照抽出籤所對應的洞各擊一槌，假設每支籤被抽中的機率相等。若所擊的兩個洞的中點也是格子點，則僅有中點所在的洞冒出 $100$ 元獎金；否則此局結束。只玩一局可得 $100$ 元獎金的機率為______。","options":[],"answer":"8/35","explanation":["兩點中點為格子點 $\\Leftrightarrow$ 兩點的 $x$ 坐標同奇偶且 $y$ 坐標同奇偶。","坐標 $0\\sim 5$ 中，奇數有 $3$ 個（$1,3,5$）、偶數有 $3$ 個（$0,2,4$）。","四類點數：（奇,奇）$9$ 點、（奇,偶）$9$ 點、（偶,奇）$9$ 點、（偶,偶）$9$ 點。","有利情形 $=4\\times C_{2}^{9}=4\\times 36=144$；總情形 $=C_{2}^{36}=630$。","所求機率 $=\\frac{144}{630}=\\frac{8}{35}$。","觀念回顧：中點為格子點的充要條件是兩端點坐標同奇偶；用奇偶分類簡化計數。"],"hasFigure":false},{"id":"u5a_8","unit":"五","chapter":"排列組合與機率","track":"A","source":"112 學年度學科能力測驗 數學A","concept":"排列計數","stem":"將數字 $1$、$2$、$3$、$\\cdots$、$7$ 等 $7$ 個數字排成七位數（數字不得重複），使得前 $4$ 位從左至右遞增、且後 $4$ 位從左至右遞減。試問共有幾個滿足條件的七位數？","options":["(1) $\\frac{6!}{3!3!}$","(2) $\\frac{6!}{4!2!}$","(3) $\\frac{7!}{4!3!}$","(4) $\\frac{6!}{3!}$","(5) $\\frac{7!}{4!}$"],"answer":"(1)","explanation":["數字 $7$ 最大，必須放在最中間（第 $4$ 位），才能同時滿足前遞增、後遞減。","從剩餘 $1\\sim 6$ 中任選 $3$ 個放在前 $3$ 位（由小到大只有一種排法），剩下 $3$ 個放在後 $3$ 位（由大到小一種排法）。","故總數為 $C_{3}^{6}=\\frac{6!}{3!3!}=20$。","觀念回顧：單調排列只有一種排法，問題化為「選哪些數字放哪一側」的組合問題。"],"hasFigure":false},{"id":"u5a_9","unit":"五","chapter":"排列組合與機率","track":"A","source":"112 學年度學科能力測驗 數學A","concept":"期望值（跨單元：空間向量）","stem":"坐標空間中，考慮邊長為 $2$ 的正立方體，固定一頂點 $O$。從 $O$ 以外的七個頂點隨機選取相異兩點，設此兩點為 $P$、$Q$，試問所得的內積 $\\vec{OP}\\cdot\\vec{OQ}$ 之期望值為下列哪一個選項？","options":["(1) $\\frac{16}{7}$","(2) $\\frac{20}{7}$","(3) $\\frac{24}{7}$","(4) $4$","(5) $\\frac{32}{7}$"],"answer":"(3)","explanation":["設 $O=(0,0,0)$，其餘頂點坐標為 $(0/2,0/2,0/2)$ 扣掉原點，共 $7$ 點。","任選兩點有 $C_{2}^{7}=21$ 種等可能情形。以程式窮舉 $21$ 組內積之和為 $72$（邊長 $1$ 時和為 $18$），期望值 $=\\frac{72}{21}=\\frac{24}{7}$。","（邊長放大 $2$ 倍，內積變為 $4$ 倍：$\\frac{6}{7}\\times 4=\\frac{24}{7}$。）","觀念回顧：期望值 $=\\frac{1}{n}\\sum x_i$；對稱性可用分類或窮舉簡化計算。"],"hasFigure":false},{"id":"u5a_10","unit":"五","chapter":"排列組合與機率","track":"A","source":"113 學年度學科能力測驗 數學A","concept":"組合計數","stem":"將 $1$ 到 $30$ 這 $30$ 個正整數平分成甲乙兩組，每組各 $15$ 個數，使得甲組的中位數比乙組的中位數小 $1$。試問共有幾種分法？","options":["(1) $C_{15}^{30}$","(2) $C_{7}^{14}$","(3) $(C_{7}^{14})^2$","(4) $2\\times C_{7}^{14}$","(5) $C_{14}^{28}$"],"answer":"(3)","explanation":["每組 $15$ 個數，中位數為第 $8$ 個數。設甲組中位數為 $m$，乙組為 $m+1$。","甲組有 $7$ 個數小於 $m$，乙組有 $7$ 個數小於 $m+1$（即小於等於 $m$，但 $m$ 在甲組）。","故 $1\\sim(m-1)$ 共 $m-1$ 個數要分成 $7+7=14$ 個，得 $m-1=14$，$m=15$。","將 $1\\sim 14$ 分成兩組各 $7$ 個：$C_{7}^{14}$ 種；將 $17\\sim 30$ 分成兩組各 $7$ 個：$C_{7}^{14}$ 種。","總分法數 $=(C_{7}^{14})^2$。","觀念回顧：先由中位數差決定中位數本身，再分別處理「小於」與「大於」的數。"],"hasFigure":false},{"id":"u5a_11","unit":"五","chapter":"排列組合與機率","track":"A","source":"113 學年度學科能力測驗 數學A","concept":"期望值","stem":"某商場舉辦摸彩箱抽獎活動，報名截止後，主持人依報名人數置入同數量的摸彩球，其中有 $8$ 顆被標示為幸運獎，其獎項為 $4000$ 元禮券及 $6000$ 元禮券各 $4$ 顆，每顆球被抽中的機率皆相同，抽後不放回。抽獎前，主辦單位公告中獎機率為 $0.5\\%$。開始抽獎後，每人依序抽球，每個人只有一次抽獎機會。若前 $100$ 位參加抽獎者，恰有 $1$ 人抽中 $4000$ 元禮券且沒有人抽中 $6000$ 元禮券，則抽獎順序為第 $101$ 號者可獲禮券金額的期望值為______元。","options":[],"answer":"24","explanation":["先求總球數 $n$：$\\frac{8}{n}=0.5\\%$，得 $n=1600$。","前 $100$ 人已抽走 $100$ 球（含 $1$ 顆 $4000$ 元），剩下 $1500$ 球，其中 $4000$ 元禮券剩 $3$ 顆、$6000$ 元禮券剩 $4$ 顆。","第 $101$ 號抽中 $4000$ 元的機率為 $\\frac{3}{1500}$，抽中 $6000$ 元的機率為 $\\frac{4}{1500}$。","期望值 $=\\frac{3\\times 4000+4\\times 6000}{1500}=\\frac{36000}{1500}=24$ 元。","觀念回顧：不放回抽樣用超幾何概念；期望值 $=\\sum$（金額$\\times$機率）。"],"hasFigure":false},{"id":"u5a_12","unit":"五","chapter":"排列組合與機率","track":"A","source":"114 學年度學科能力測驗 數學A","concept":"排列計數","stem":"某校舉辦音樂會，包含鋼琴表演 $4$ 個、小提琴表演 $3$ 個、歌唱表演 $2$ 個等三類表演共 $9$ 個不同曲目。該校想將同類表演排在一起，且歌唱不能排在最前面。試問這場音樂會可能的曲目排列方式共有幾種？","options":["(1) $4!\\times 3!\\times 2!$","(2) $2\\times 4!\\times 3!\\times 2!$","(3) $3\\times 4!\\times 3!\\times 2!$","(4) $4\\times 4!\\times 3!\\times 2!$","(5) $6\\times 4!\\times 3!\\times 2!$"],"answer":"(4)","explanation":["先決定三類表演的順序。歌唱不能在最前面，故歌唱排第 $2$ 或第 $3$ 位。","歌唱排第 $2$ 位時，另兩類有 $2!$ 種排法；歌唱排第 $3$ 位時，亦有 $2!$ 種，共 $4$ 種類別順序。","各類內部曲目排列數為 $4!\\times 3!\\times 2!$。","總排列方式 $=4\\times 4!\\times 3!\\times 2!$。","觀念回顧：同類綁在一起先排種類順序（受限制），再排類內順序，兩階段相乘。"],"hasFigure":false},{"id":"u5a_13","unit":"五","chapter":"排列組合與機率","track":"A","source":"114 學年度學科能力測驗 數學A","concept":"期望值","stem":"假日市集有個攤位推出「試試手氣」遊戲。規則為：顧客投擲一枚均勻硬幣至多 $4$ 次，累積擲得 $2$ 個正面就停止。前 $2$ 次連續擲得 $2$ 個正面者，只需付 $112$ 元；擲到第 $3$ 次才累積得 $2$ 個正面者，付 $144$ 元；擲到第 $4$ 次才累積得 $2$ 個正面者，付 $176$ 元；$4$ 次投完仍未累積 $2$ 個正面者，付 $208$ 元。參與此遊戲的顧客所付金額的期望值為______元。","options":[],"answer":"162","explanation":["前 $2$ 次連續 $2$ 正面的機率為 $(\\frac{1}{2})^2=\\frac{1}{4}$；","第 $3$ 次才累積 $2$ 正面：前 $2$ 次為 $1$ 正 $1$ 反（$C_{1}^{2}$ 種），第 $3$ 次為正面，機率 $=2\\times(\\frac{1}{2})^3=\\frac{1}{4}$；","第 $4$ 次才累積 $2$ 正面：前 $3$ 次為 $1$ 正 $2$ 反（$C_{1}^{3}$ 種），第 $4$ 次為正面，機率 $=3\\times(\\frac{1}{2})^4=\\frac{3}{16}$；","未累積 $2$ 正面：$1-\\frac{1}{4}-\\frac{1}{4}-\\frac{3}{16}=\\frac{5}{16}$。","期望值 $=112\\times\\frac{1}{4}+144\\times\\frac{1}{4}+176\\times\\frac{3}{16}+208\\times\\frac{5}{16}=28+36+33+65=162$ 元。","觀念回顧：「第 $k$ 次才成功」＝前 $k-1$ 次恰成功 $r-1$ 次且第 $k$ 次成功，用二項分布計算。"],"hasFigure":false},{"id":"u5a_14","unit":"五","chapter":"排列組合與機率","track":"A","source":"115 學年度學科能力測驗 數學A","concept":"期望值","stem":"財神廟舉辦抽發財金活動：參加者抽兩次籤，每次抽籤出現「福」、「祿」的機率皆為 $\\frac{1}{4}$。如果兩次都抽得「福」，獲得獎金 $200$ 元；如果兩次都抽得「祿」，獲得獎金 $120$ 元；其餘情況則無獎金。試問參加者可獲獎金的期望值為何？","options":["(1) $10$ 元","(2) $15$ 元","(3) $20$ 元","(4) $25$ 元","(5) $30$ 元"],"answer":"(3)","explanation":["兩次都抽得「福」的機率為 $\\frac{1}{4}\\times\\frac{1}{4}=\\frac{1}{16}$；","兩次都抽得「祿」的機率為 $\\frac{1}{4}\\times\\frac{1}{4}=\\frac{1}{16}$。","期望值 $=\\frac{1}{16}\\times 200+\\frac{1}{16}\\times 120=\\frac{320}{16}=20$ 元。","觀念回顧：獨立事件機率相乘；期望值 $=\\sum$（獎金$\\times$機率）。"],"hasFigure":false},{"id":"u5a_15","unit":"五","chapter":"排列組合與機率","track":"A","source":"115 學年度學科能力測驗 數學A","concept":"分類計數","stem":"某網遊有 $20$ 種材料，其中 $8$ 種為基本材料，$12$ 種為進階材料。任選 $3$ 種不同材料可以合成出草藥、食物、藥水中的 $1$ 類道具，其合成規則如下：若 $3$ 種材料均為基本材料，則合成結果必為同一種草藥；若 $3$ 種材料中 $2$ 種為基本材料、$1$ 種為進階材料，則合成結果會根據不同的進階材料得到不同種的食物，但不會受到基本材料不同而改變；其他的組合都會合成出不同種的藥水。試問此網遊總共可合成出多少種道具？","options":["(1) $651$","(2) $701$","(3) $761$","(4) $811$","(5) $861$"],"answer":"(3)","explanation":["草藥：$3$ 種皆為基本材料時必為同一種，故只有 $1$ 種；","食物：$2$ 基本 $+1$ 進階時，只由進階材料決定種類，故有 $12$ 種；","藥水：其餘組合每種各異。總組合 $C_{3}^{20}=1140$，扣除草藥組合 $C_{3}^{8}=56$、食物組合 $C_{2}^{8}\\times C_{1}^{12}=336$，得藥水 $1140-56-336=748$ 種。","總道具數 $=1+12+748=761$ 種。","觀念回顧：分類計數：先判斷每類的決定關鍵，再用加法原理合併；注意「不受…影響」表示合併計算。"],"hasFigure":false},{"id":"u5b_1","unit":"五","chapter":"排列組合與機率","track":"B","source":"110 試辦學科能力測驗 數學B","concept":"不相鄰排列","stem":"某甲買了 $6$ 個不同的便當盒與 $1$ 個便當盒架，架子上可把便當盒排成一橫排。因為醬油和醋不細看有點像，怕放一起會不小心拿錯，因此某甲決定，放醬油的便當盒和放醋的便當盒不能放隔壁。在此限制條件下，試問 $6$ 個便當盒總共有多少種放置的方法？","options":["(1) $240$","(2) $360$","(3) $480$","(4) $600$","(5) $720$"],"answer":"(3)","explanation":["全部的排法有 $6!=720$ 種。","醬油和醋相鄰的排法：將兩者綁在一起視為一體，共有 $2\\times 5!=240$ 種。","故不相鄰的排法為 $720-240=480$ 種。","觀念回顧：「不相鄰」用扣減法：全部減去相鄰；或用插空法。"],"hasFigure":false},{"id":"u5b_2","unit":"五","chapter":"排列組合與機率","track":"B","source":"110 試辦學科能力測驗 數學B","concept":"組合計數","stem":"有五對夫婦共 $10$ 人相約去旅遊，並決定組 $3$ 人小組來統籌及安排旅遊細節。若該小組由 $10$ 人中任選 $3$ 人產生，則該 $3$ 人小組中沒有任何夫妻檔的組合方式有______種。","options":[],"answer":"80","explanation":["要避免夫妻檔，必須從 $5$ 對夫婦中選出 $3$ 對，每對只取其中一人。","選 $3$ 對夫婦的方法有 $C_{3}^{5}=10$ 種；每對有 $2$ 種選法（夫或婦），共 $2^3=8$ 種。","故總方法數為 $10\\times 8=80$ 種。","觀念回顧：分步計數：先選對象，再選細節；$C_{k}^{n}$ 與乘法原理的結合。"],"hasFigure":false},{"id":"u5b_3","unit":"五","chapter":"排列組合與機率","track":"B","source":"110 試辦學科能力測驗 數學B","concept":"古典機率","stem":"有 $8$ 位籃球愛好者在籃球場相遇，想分成兩隊，每隊 $4$ 人，進行四對四鬥牛。組隊方式以每人出「手心」或「手背」的方式決定，當出「手心」與「手背」各 $4$ 人時，同出手心的 $4$ 人組成一隊，而同出手背的 $4$ 人為另一隊。若每人出手心或手背的機率相等，且各人出手方式相互獨立，則這 $8$ 人出手一次就組隊成功的機率為______。（化為最簡分數）","options":[],"answer":"35/128","explanation":["$8$ 個人隨意出手，方法共有 $2^8=256$ 種（樣本空間）。","組隊成功需要剛好 $4$ 人出手心、$4$ 人出手背，方法有 $C_{4}^{8}=70$ 種。","故機率為 $\\frac{70}{256}=\\frac{35}{128}$。","觀念回顧：古典機率 $=\\frac{\\text{有利結果數}}{\\text{樣本空間}}$；注意化為最簡分數。"],"hasFigure":false},{"id":"u5b_4","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度學科能力測驗 數學B","concept":"不相鄰組合","stem":"有九棟大廈排成一列，由左至右分別編號 $1,2,3,4,5,6,7,8,9$。今電信公司想選取其中三棟大廈的屋頂分別設立一座電信基地台。若基地台不能設立於相鄰的兩棟大廈，以免訊號互相干擾，試問在 $4$ 號大廈不設立基地台的情況下，有多少種設立基地台的選取方法？","options":["(1) $12$","(2) $16$","(3) $20$","(4) $24$","(5) $30$"],"answer":"(4)","explanation":["$4$ 號大廈不設立，剩下 $1,2,3,5,6,7,8,9$ 共 $8$ 棟可選。","從這 $8$ 棟中選 $3$ 棟，且任兩棟在原編號下不相鄰。","將選出的 $3$ 棟由小到大記為 $a<b<c$。令 $a'=a$、$b'=b-1$、$c'=c-2$，則 $a'<b'<c'$ 為從調整後的編號中任選 $3$ 個（不相鄰條件轉化為嚴格遞增）。","經程式枚舉驗算，符合條件的選法共 $24$ 種。","觀念回顧：不相鄰選取可用插空法或轉化為組合數；有禁選條件時先扣除再計數。"],"hasFigure":false},{"id":"u5b_5","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度學科能力測驗 數學B","concept":"古典機率","stem":"袋中有紅、白、黑三種顏色的球共 $12$ 顆。今從袋中隨機抽取兩顆球（每顆球被抽中的機率相等），若抽出的兩顆球皆為紅色的機率為 $\\frac{1}{22}$，皆為白色的機率為 $\\frac{5}{22}$，則從袋中隨機抽出兩球，此兩球為相異顏色的機率為______。（化為最簡分數）","options":[],"answer":"15/22","explanation":["設紅球 $r$ 顆、白球 $w$ 顆、黑球 $b$ 顆，$r+w+b=12$。","$\\frac{C_{2}^{r}}{C_{2}^{12}}=\\frac{1}{22}$，得 $C_{2}^{r}=3$，故 $r=3$。","$\\frac{C_{2}^{w}}{C_{2}^{12}}=\\frac{5}{22}$，得 $C_{2}^{w}=15$，故 $w=6$。黑球 $b=12-3-6=3$。","兩球同色的機率 $=\\frac{C_{2}^{3}+C_{2}^{6}+C_{2}^{3}}{C_{2}^{12}}=\\frac{3+15+3}{66}=\\frac{7}{22}$。","故相異顏色的機率 $=1-\\frac{7}{22}=\\frac{15}{22}$。","觀念回顧：先由機率反推各色球數；「相異」用 $1$ 減去「相同」較簡便。"],"hasFigure":false},{"id":"u5b_6","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度學科能力測驗 數學B","concept":"排列計數","stem":"有二女四男共六位同學，畢業後老師邀聚餐，餐後七人站一橫排照相留念。已知同學中有一女一男兩位曾有過不愉快，照相時不想相鄰，而老師站在正中間且四位男生不完全站在老師的同一側，則可能的排列方式共有______種。","options":[],"answer":"528","explanation":["老師固定在正中間（第 $4$ 位），剩下 $6$ 個位置給二女四男排列。","條件一：特定一女一男不相鄰（注意正中間隔著老師的位置不算相鄰）。","條件二：四位男生不完全在老師的同一側（即左右兩側都有男生）。","經程式枚舉驗算，符合條件的排列共 $528$ 種。","觀念回顧：多重條件的排列用枚舉或分步討論；「不完全同側」即兩側皆有人。"],"hasFigure":false},{"id":"u5b_7","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度參考試卷 數學B","concept":"二項式定理","stem":"在 $(2x-y)^{10}$ 的展開式中，$x^7y^3$ 項的係數為何？","options":["(1) $-15360$","(2) $-120$","(3) $120$","(4) $960$","(5) $15360$"],"answer":"(1)","explanation":["由二項式定理，$(2x-y)^{10}$ 展開式的一般項為 $C_{k}^{10}(2x)^{10-k}(-y)^k$。","求 $x^7y^3$ 項，取 $k=3$：$C_{3}^{10}(2x)^7(-y)^3$。","$C_{3}^{10}=120$，$(2x)^7=128x^7$，$(-y)^3=-y^3$。","故係數為 $120\\times 128\\times(-1)=-15360$。","觀念回顧：二項式 $(a+b)^n$ 的第 $k+1$ 項為 $C_{k}^{n}a^{n-k}b^k$；注意負號的次方。"],"hasFigure":false},{"id":"u5b_8","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度參考試卷 數學B","concept":"機率的遞推","stem":"有一廠商承包某一展覽會場造景工程，雙方於契約內容明定下列條約：壹、簽約後在展覽會場種下造景植栽 $800$ 株。貳、四個月後展覽會場存活的造景植栽比率須達 $90\\%$。承包廠商根據過去種植經驗，發現以下現象：（一）植栽幼苗種下，第一個月的存活率為 $75\\%$。（二）植栽幼苗種下，第一個月存活的植栽經過第二個月的存活率為 $85\\%$。（三）植栽幼苗種下，兩個月後仍存活的植栽則能存活至少六個月。承包廠商為了完成契約，每個月底會在死亡的植栽處，重新補種新的幼苗。根據上述條件，試選出正確的選項。","options":["(1) 第一個月底廠商會補種新的幼苗 $200$ 株","(2) 第二個月底存活的植栽為 $660$ 株","(3) 每個月底廠商補種新的幼苗數量會逐漸減少","(4) 第三個月底存活的植栽中，能存活到第四個月底的比率不足 $85\\%$","(5) 承包廠商可順利完成契約"],"answer":"(1)(2)(3)(5)","explanation":["(1) 第一個月存活率 $75\\%$，死亡 $25\\%$，補種 $800\\times 25\\%=200$ 株，正確；","(2) 第一個月存活的 $600$ 株，第二個月存活 $600\\times 85\\%=510$ 株；補種的 $200$ 株存活 $200\\times 75\\%=150$ 株；合計 $510+150=660$ 株，正確；","(3) 每月補種數：$200$、$140$、$58$、$30$，逐漸減少，正確；","(4) 第三個月底存活的植栽中，絕大部分已超過兩個月齡，存活率接近 $100\\%$，能活到第四個月的比率約 $92.8\\%$，超過 $85\\%$，故「不足 $85\\%$」錯誤；","(5) 第四個月底存活 $770$ 株，比率 $770/800=96.25\\%\\geq 90\\%$，可完成契約，正確。","觀念回顧：分階段計算存活數；注意不同月齡的植栽適用不同的存活率。"],"hasFigure":false},{"id":"u5b_9","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度參考試卷 數學B","concept":"計數原理","stem":"某連鎖超市在五個城市共設立 $12$ 間分店。為使各家分店之間能夠迅速調貨，要求在不同城市中，任意兩家分店之間必須設置一條快遞路線，同城市之分店之間則不須設置快遞路線。假設 $12$ 間分店的分布如下表：城市：A、B、C、D、E；分店數：$3$、$3$、$2$、$2$、$2$。試問 A 城市中每家分店需要幾條快遞路線？","options":["(1) $6$","(2) $9$","(3) $12$","(4) $18$","(5) $27$"],"answer":"(2)","explanation":["A 城市的每家分店，需要連接到「其他城市」的所有分店。","其他四個城市的分店數共 $3+2+2+2=9$ 間。","故 A 城市每家分店需要 $9$ 條快遞路線。","觀念回顧：跨城市連線：每家分店的路線數 $=$ 總店數 $-$ 同城市店數。"],"hasFigure":false},{"id":"u5b_10","unit":"五","chapter":"排列組合與機率","track":"B","source":"111 學年度參考試卷 數學B","concept":"計數原理","stem":"（承上題情境）因業績良好，總公司打算展店，並計畫在五個城市共設立 $17$ 間分店，每個城市至少有三家分店；試問最少需要幾條快遞路線？（快遞路線設置規則同上題）______。","options":[],"answer":"114","explanation":["總路線數 $=$ 任意兩店的配對數 $-$ 同城市的配對數 $=C_{2}^{17}-\\sum C_{2}^{n_i}$。","要使總路線最少，需最大化同城市配對數 $\\sum C_{2}^{n_i}$。","每城至少 $3$ 間，用去 $15$ 間，剩 $2$ 間可分配。兩種情形：","情形一：$2$ 間放同一城市，分布為 $(5,3,3,3,3)$，同城配對 $=C_{2}^{5}+4\\times C_{2}^{3}=10+12=22$，總路線 $=136-22=114$；","情形二：各放 $1$ 間到不同城市，分布為 $(4,4,3,3,3)$，同城配對 $=2\\times C_{2}^{4}+3\\times C_{2}^{3}=12+9=21$，總路線 $=136-21=115$。","故最少需要 $114$ 條快遞路線。","觀念回顧：總量減去內部量；求極值時討論分配情形。"],"hasFigure":false},{"id":"u5b_11","unit":"五","chapter":"排列組合與機率","track":"B","source":"112 學年度學科能力測驗 數學B","concept":"等差數列計數","stem":"自 $1$ 至 $16$ 的正整數中任取三個相異數，若此三數由小到大成等差數列，則共有______種取法。","options":[],"answer":"56","explanation":["三數 $a<b<c$ 成等差 $\\Leftrightarrow b-a=c-b$，即 $b$ 為 $a$ 與 $c$ 的算術平均數。","方法一（程式枚舉）：從 $C_{3}^{16}=560$ 種取法中，逐一檢查是否成等差，得 $56$ 種。","方法二（公式）：公差為 $d$ 時，首項 $a$ 有 $16-2d$ 種選擇，$d=1,2,\\cdots,7$，總數 $=\\sum_{d=1}^{7}(16-2d)=14+12+\\cdots+2=56$。","觀念回顧：等差數列由首項與公差決定；計數時按公差分類。"],"hasFigure":false},{"id":"u5b_12","unit":"五","chapter":"排列組合與機率","track":"B","source":"112 學年度學科能力測驗 數學B","concept":"計數","stem":"考慮所有只用 $0,1$ 兩種數字組成的序列，序列長度 $n$ 是指該序列由 $n$ 個數字組成（可重複出現）。令 $a(n)$ 為在所有長度 $n$ 的序列中連續兩個零（即 $00$）出現的次數總和。例如長度 $3$ 的序列中，$000$ 貢獻 $2$ 次 $00$，$001$、$100$ 各貢獻 $1$ 次，故 $a(3)=4$。則 $a(6)$ 的值為______。","options":[],"answer":"80","explanation":["長度 $6$ 的二元序列共 $2^6=64$ 種。對每個序列，計算其中「$00$」出現的次數（重疊計算，如 $000$ 算 $2$ 次）。","用程式枚舉所有 $64$ 種序列並加總，得 $a(6)=80$。","（驗算思路：固定「$00$」出現的位置，有 $5$ 個可能位置；每個位置固定後，其餘 $4$ 個位置各有 $2$ 種填法，但需注意重疊情形如 $000$ 的重複計算，枚舉最為可靠。）","觀念回顧：「出現次數總和」需對所有序列加總；重疊情形（如 $000$）要重複計算。"],"hasFigure":false},{"id":"u5b_13","unit":"五","chapter":"排列組合與機率","track":"B","source":"113 學年度學科能力測驗 數學B","concept":"集合與比例","stem":"某校全體高三學生都有報考學測數學 A 或數學 B，在這些學生中只報考數學 A 的學生占全體高三學生的 $\\frac{1}{4}$。報考數學 A 的學生中有 $\\frac{3}{5}$ 的學生同時也報考數學 B。則只報考數學 B 的學生在該校所有報考數學 B 的學生中所占的比例為______。","options":[],"answer":"1/2","explanation":["設全體學生為 $1$。只報 A 的占 $\\frac{1}{4}$。","設報考 A 的比例為 $x$，則同時報考 A、B 的為 $\\frac{3}{5}x$。","報考 A 的 $=$ 只報 A 的 $+$ 同時報考的，即 $x=\\frac{1}{4}+\\frac{3}{5}x$，解得 $x=\\frac{5}{8}$。","同時報考 A、B 的 $=\\frac{3}{5}\\times\\frac{5}{8}=\\frac{3}{8}$；只報 B 的 $=1-\\frac{5}{8}=\\frac{3}{8}$。","報考 B 的 $=\\frac{3}{8}+\\frac{3}{8}=\\frac{3}{4}$，故所求比例 $=\\frac{3/8}{3/4}=\\frac{1}{2}$。","觀念回顧：集合的包含關係：報 A $=$ 只報 A $+$ 兩者都報；用未知數列方程式求解。"],"hasFigure":false},{"id":"u5b_14","unit":"五","chapter":"排列組合與機率","track":"B","source":"113 學年度學科能力測驗 數學B","concept":"組合計數","stem":"在一圓的圓周上取 $6$ 個等分點並以順時針方向依序編 $1$ 號至 $6$ 號。由這 $6$ 個點任取 $3$ 點為頂點所形成的三角形中，三個內角的角度由小到大會成等差數列的三角形有______個。","options":[],"answer":"14","explanation":["三內角 $a-d,a,a+d$ 成等差，內角和 $180°$，得 $a=60°$。故目標三角形必有一內角為 $60°$。","在 $6$ 等分點的圓周上，圓周角為對應圓心角的一半。內角 $60°$ 對應的弦所對圓心角為 $120°$，即相隔 $2$ 個等分間距。","用程式枚舉 $C_{3}^{6}=20$ 種取法，計算每個三角形的三內角，檢查是否有 $60°$ 內角，得 $14$ 個。","觀念回顧：三角形內角成等差 $\\Leftrightarrow$ 必有一角 $60°$；圓周角定理輔助判斷。"],"hasFigure":false},{"id":"u5b_15","unit":"五","chapter":"排列組合與機率","track":"B","source":"114 學年度學科能力測驗 數學B","concept":"古典機率","stem":"某商店推出抽獎活動，提供五種不同款式的公仔當獎品。每次抽獎可得 $1$ 個公仔，且每種款式被抽中的機率皆相等。某甲決定抽獎四次，試問他恰抽到三種不同款式公仔的機率為何？","options":["(1) $\\frac{12}{25}$","(2) $\\frac{36}{125}$","(3) $\\frac{48}{125}$","(4) $\\frac{72}{125}$","(5) $\\frac{96}{125}$"],"answer":"(4)","explanation":["每次抽獎有 $5$ 種結果，四次共 $5^4=625$ 種可能。","恰抽到三種不同款式，表示四次中有某一種重複抽到兩次，其餘兩種各一次。","先選四次中哪兩次相同：$C_{2}^{4}=6$ 種；再選款式：重複的款式 $5$ 種選 $1$，其餘兩種 $4\\times 3$ 種。","有利結果數 $=6\\times 5\\times 4\\times 3=360$，機率 $=\\frac{360}{625}=\\frac{72}{125}$。","觀念回顧：「恰 $k$ 種」先決定重複模式，再選款式；分步計數。"],"hasFigure":false},{"id":"u5b_16","unit":"五","chapter":"排列組合與機率","track":"B","source":"114 學年度學科能力測驗 數學B","concept":"組合計數","stem":"某公司聘請 $10$ 名新進員工，其中含 $2$ 名翻譯、$4$ 名工程師與 $4$ 名助理。將此 $10$ 人分派給研發、測試兩個部門，其中每個部門各分派 $5$ 人，且各需含 $1$ 名翻譯與至少 $1$ 名工程師。依此共有______種分配方法。","options":[],"answer":"136","explanation":["兩部門各需 $1$ 名翻譯：將 $2$ 名翻譯分到兩個部門，有 $2$ 種方法。","其餘 $8$ 人（$4$ 工程師、$4$ 助理）選 $4$ 人進研發部門：$C_{4}^{8}=70$ 種。","但不能讓 $4$ 名工程師全進同一部門（違反「至少 $1$ 名」），扣除 $2$ 種，得 $70-2=68$ 種。","故總方法數為 $2\\times 68=136$ 種。","觀念回顧：先處理有指定名額的身分（翻譯），再處理其餘；「至少」用扣減法。"],"hasFigure":false},{"id":"u5b_17","unit":"五","chapter":"排列組合與機率","track":"B","source":"115 學年度學科能力測驗 數學B","concept":"相鄰排列","stem":"將 $1,2,3,4,5,6,7,8$ 八個數字排成一個八位數。若要求排出的數字中 $2,3$ 相鄰、$5,6$ 相鄰以及 $6,7$ 相鄰（即 $5,6,7$ 三個數字連在一起），則共可排出______個八位數。","options":[],"answer":"480","explanation":["將相鄰要求綁在一起：$[23]$、$[567]$ 視為兩個大單位，加上 $1$、$4$、$8$，共 $5$ 個單位排列，有 $5!=120$ 種。","$[23]$ 內部 $2,3$ 可交換：$2!$ 種；$[567]$ 中 $5,7$ 可交換（$6$ 固定在中間）：$2!$ 種。","故總數為 $120\\times 2\\times 2=480$ 個。","觀念回顧：相鄰用綁一起法；多個相鄰條件可合併為更大的綁定單位。"],"hasFigure":false},{"answer":"(3)(4)(5)","chapter":"數據分析","concept":"中位數、標準差、相關係數","explanation":["(1) 甲牧場牛隻第 3 年比第 2 年少，並非逐年增加，錯誤；","(2) 甲牧場牛隻 7 筆資料由小到大為 11、12、12、13、14、14、15，中位數為第 4 筆 13 單位，不是 12，錯誤；","(3) 甲牧場牛隻平均為 13，各筆與平均的差皆不超過 2，故標準差 $<2$ 單位，正確；","(4) 乙牧場豬隻 7 年總和為 98，平均 $=14$ 單位，正確；","(5) 甲牧場牛增豬大致減但不規律，相關係數約 $-0.42$；乙牧場牛增豬減呈完全線性，相關係數 $=-1$。$-0.42>-1$，故甲大於乙，正確。","觀念回顧：中位數為排序後中央值；標準差衡量資料分散程度；相關係數 $r\\in[-1,1]$，$|r|$ 愈大線性關係愈強。"],"hasFigure":true,"id":"u6a_1","options":["(1) 甲、乙兩牧場的牛隻數目都逐年增加","(2) 甲牧場牛隻數目的中位數為 12 單位","(3) 甲牧場牛隻數目的標準差小於 2 單位","(4) 乙牧場豬隻數目的算術平均數最接近的整數為 14 單位","(5) 甲牧場牛與豬隻數目的相關係數大於乙牧場牛與豬隻數目的相關係數"],"source":"110 試辦學科能力測驗 數學A","stem":"甲乙兩牧場記錄了 7 年畜養牛、豬的數目，其畜養牛、豬數目與時間資料分別如下圖所示（1 單位代表 100 隻）。依據上述資料，試選出正確的選項。","track":"A","unit":"六"},{"answer":"(5)","chapter":"數據分析","concept":"投影數據的變異數","explanation":["「變異數最小」即數據投影後最集中。數據大致沿直線 $y=2x$ 分布（長軸方向）。","投影到與長軸垂直的方向時，投影點最集中，變異數最小。與 $y=2x$ 垂直的直線斜率為 $-\\frac{1}{2}$。","故選 (5) $y=-\\frac{x}{2}$。","觀念回顧：投影變異數最大／最小的方向即數據分布的長軸／短軸方向；兩者互相垂直。"],"hasFigure":true,"id":"u6a_2","options":["(1) $y=2x$","(2) $y=-2x$","(3) $y=-x$","(4) $y=\\frac{x}{2}$","(5) $y=-\\frac{x}{2}$"],"source":"111 學年度學科能力測驗 數學A","stem":"在處理二維數據時，有種方法是將數據垂直投影到某一直線，並以該直線為數線，進而了解投影點所成一維數據的變異。下圖的一組二維數據，試問投影到哪一選項的直線，所得之一維投影數據的變異數會是最小？","track":"A","unit":"六"},{"answer":"(1)(5)","chapter":"數據分析","concept":"比率與加權平均","explanation":["(1) 三個失業率中最高的是 11.20%，即 25～29 歲，正確；","(2) 表中只有比率，沒有人數資訊，無法比較勞動力人數，錯誤；","(3) 合併的失業率是加權平均 $\\frac{11.20n_1+6.40n_2}{n_1+n_2}$，只有兩組人數相等時才等於算術平均，錯誤；","(4) 兩年齡層的失業率無因果關係，錯誤；","(5) 設 20～24 歲、25～29 歲勞動力人數為 $n_1,n_2$，則 $\\frac{8.50n_1+11.20n_2}{n_1+n_2}=10.50$，解得 $0.70n_2=2.00n_1$，故 $n_2>n_1$，正確。","觀念回顧：比率合併用加權平均（分點公式）；只有比率無法推得人數大小；相關不等於因果。"],"hasFigure":false,"id":"u6a_3","options":["(1) 上表三個年齡範圍中，以 25～29 歲的失業率最高","(2) 25～29 歲勞動力人數多於 30～34 歲勞動力人數","(3) 25～34 歲的失業率等於 $\\frac{11.20+6.40}{2}\\%$","(4) 如果 25～29 歲的失業率降低，則 30～34 歲的失業率會升高","(5) 若經統計得 20～29 歲的失業率為 10.50%，則 20～24 歲勞動力人數少於 25～29 歲勞動力人數"],"source":"111 學年度參考試卷 數學A","stem":"所謂某個年齡範圍的失業率，是指該年齡範圍的失業人數與勞動力人數之比，以百分數表達。下表為去年某國三個年齡範圍的失業率。年齡範圍：20～24 歲、25～29 歲、30～34 歲；失業率：8.50%、11.20%、6.40%。根據上表，試選出正確的選項。","track":"A","unit":"六"},{"answer":"(4)","chapter":"數據分析","concept":"迴歸直線、對數","explanation":["圖中 $(s_k,\\log t_k)$ 大致落在直線 $\\log t=2s$ 上（斜率約為 2，通過原點）。","由 $\\log t=2s$ 得 $t=10^{2s}=(10^2)^s=100^s$。","故選 (4)。","觀念回顧：指數關係取對數後變成線性關係；由迴歸直線的斜率與截距還原原變數的關係式。"],"hasFigure":true,"id":"u6a_4","options":["(1) $s=2t$","(2) $s=3t$","(3) $t=10^s$","(4) $t=100^s$","(5) $t^2=10^s$"],"source":"112 學年度學科能力測驗 數學A","stem":"某生推導出兩物理量 $s,t$ 應滿足一等式。為了驗證其理論，他做了實驗得到 15 筆數據 $(s_k,t_k)$，$k=1,\\cdots,15$。老師建議他將其中的 $t_k$ 先取對數，在坐標平面上標出對應的點 $(s_k,\\log t_k)$，如圖所示；其中第一個數據為橫軸坐標，第二個數據為縱軸坐標。利用迴歸直線分析，某生印證了其理論。試問該生所得 $s,t$ 的關係式最可能為下列哪一選項？","track":"A","unit":"六"},{"answer":"(3)","chapter":"數據分析","concept":"迴歸直線、相關係數","explanation":["$(\\overline{x_A},\\overline{y_A})$ 必在 $L_A$ 上，得 $\\overline{y_A}=3\\times4.8-2=12.4$；同理 $\\overline{y_B}=2\\times5.5-1=10$。","(1) $12.4>10$，錯誤；","(2) 由斜率 $m=r\\cdot\\frac{\\sigma_y}{\\sigma_x}$，得 $\\sigma_{y_A}=\\frac{3\\times0.4}{0.8}=1.5$、$\\sigma_{y_B}=\\frac{2\\times0.2}{0.4}=1$。$1.5>1$，錯誤；","(3) $|10.5-12.4|=1.9>1.5=\\sigma_{y_A}$，正確；","(4) $d(P,L_A)=\\frac{|3\\times5.2-10.5-2|}{\\sqrt{10}}\\approx0.98$，$d(P,L_B)=\\frac{|2\\times5.2-10.5-1|}{\\sqrt{5}}\\approx0.49$，前者大，錯誤；","(5) $P$ 到 $(4.8,12.4)$ 的距離 $\\approx1.94$，到 $(5.5,10)$ 的距離 $\\approx0.58$，前者大，錯誤。","觀念回顧：迴歸直線必過 $(\\bar{x},\\bar{y})$；斜率 $m=r\\frac{\\sigma_y}{\\sigma_x}$；$|r|\\leq1$。"],"hasFigure":false,"id":"u6a_5","options":["(1) $\\overline{y_A}<\\overline{y_B}$","(2) A 物種的體重標準差小於 B 物種的體重標準差","(3) 就 A 物種而言，個體 $P$ 的體重與平均體重 $\\overline{y_A}$ 之差的絕對值大於一個標準差","(4) 點 $(5.2,10.5)$ 到直線 $L_A$ 的距離小於其到直線 $L_B$ 的距離","(5) 點 $(5.2,10.5)$ 與點 $(\\overline{x_A},\\overline{y_A})$ 的距離小於其與點 $(\\overline{x_B},\\overline{y_B})$ 的距離"],"source":"113 學年度學科能力測驗 數學A","stem":"某實驗室蒐集了大量的 A、B 兩相似物種，記錄其身長為 $x$（單位：公分）與體重 $y$（單位：公克），得 A、B 兩物種的平均身長分別為 $\\overline{x_A}=4.8$、$\\overline{x_B}=5.5$，標準差分別為 0.4、0.2。令 A、B 兩物種的平均體重分別為 $\\overline{y_A}$、$\\overline{y_B}$。若 A、B 兩物種其體重 $y$ 對身長 $x$ 的迴歸直線分別為 $L_A:y=3x-2$、$L_B:y=2x-1$，相關係數分別為 0.8、0.4。今發現一隻身長 5.2 公分、體重 10.5 公克的個體 $P$，試選出正確的選項。","track":"A","unit":"六"},{"answer":"(1)(3)(4)(5)","chapter":"數據分析","concept":"迴歸直線的變數變換","explanation":["(1) 甲占比 $x\\%$，則乙占比 $u=100-x$，正確；","(2) 1 奈米 $=10^{-3}$ 微米，故 $v_k=\\frac{y_k}{1000}$，不是 $1000y_k$，錯誤；","(3) $u_k=100-x_k$ 為平移加變號，標準差不變，正確；","(4) $v=\\frac{y}{1000}=\\frac{15.2(100-u)-30}{1000}=1.49-0.0152u$，故 $b=1.49$，正確；","(5) 新增的點落在原迴歸直線上，不影響迴歸直線，正確。","觀念回顧：變數經 $u=a-bx$ 變換，標準差變為 $|b|$ 倍（此處 $|b|=1$）；迴歸直線代入變換關係即得新直線。"],"hasFigure":false,"id":"u6a_6","options":["(1) $u_k=100-x_k$，$k=1,\\cdots,20$","(2) $v_k=1000y_k$，$k=1,\\cdots,20$","(3) $u_1,\\cdots,u_{20}$ 的標準差等於 $x_1,\\cdots,x_{20}$ 的標準差","(4) $b=1.49$","(5) 若另有一筆數據 $(u_{21},v_{21})$ 滿足 $v_{21}=au_{21}+b$，則 21 筆數據的迴歸直線仍為 $v=au+b$"],"source":"114 學年度學科能力測驗 數學A","stem":"某種合金由甲和乙兩種金屬組成，某生想知道其中金屬比例與合金的波長關係。他做實驗測量「甲占比為 $x\\%$ 的合金所對應的波長 $y$（單位：奈米）」，並將得到的 20 筆數據 $(x_k,y_k)$，$k=1,\\cdots,20$，在 $xy$ 平面上標出對應的點，其迴歸直線為 $y=15.2x-30$。為符合投稿規範，須將報告描述為「乙占比為 $u\\%$ 的合金所對應的波長 $v$（單位：微米）」，他將數據轉換為 $(u_k,v_k)$，得到在 $uv$ 平面的迴歸直線為 $v=au+b$。已知 1 奈米 $=10^{-9}$ 公尺，1 微米 $=10^{-6}$ 公尺。試選出正確的選項。","track":"A","unit":"六"},{"answer":"(1)(2)(4)","chapter":"數據分析","concept":"T 分數標準化","explanation":["(1) 英文 $T=50+10\\times\\frac{60-70}{10}=40$，正確；","(2) 數學 $T=50+10\\times\\frac{S-70}{14}$。$T\\leq S$ 即 $50+\\frac{5}{7}(S-70)\\leq S$，化簡得 $0\\leq\\frac{2}{7}S$，對 $S\\geq0$ 恆成立，正確；","(3) 設數學、英文原始成績為 $S_1,S_2$，則 T 分數平均 $=50+5\\left(\\frac{S_1-70}{14}+\\frac{S_2-70}{10}\\right)$，與原始平均 $\\frac{S_1+S_2}{2}$ 加權不同，不具單調性，錯誤；","(4) 數學 $T\\geq40$ 得 $S\\geq56$；英文 $T\\geq40$ 得 $S\\geq60$。$56<60$，正確；","(5) 原始斜率 $=r\\times\\frac{10}{14}$；T 分數兩科標準差皆為 10，斜率 $=r$。兩者不同，錯誤。","觀念回顧：T 分數為線性標準化：平均 50、標準差 10；線性變換不改變相關係數，但會改變迴歸直線斜率。"],"hasFigure":false,"id":"u6a_7","options":["(1) 若甲生英文的原始成績為 60，則其 T 分數為 40","(2) 各生數學的 T 分數不會超過其原始成績","(3) 若乙生兩科的原始成績平均比丙生兩科的原始成績平均高，則乙生兩科的 T 分數平均比丙生兩科的 T 分數平均高","(4) 若該班級兩科的及格標準均為 T 分數大於或等於 40，則數學及格的原始成績比英文及格的原始成績低","(5) 該班原始成績數學對英文的迴歸直線之斜率與該班 T 分數數學對英文的迴歸直線之斜率相同"],"source":"115 學年度學科能力測驗 數學A","stem":"T 分數為評量成績的一種方式，其計算方式如下：設全班平均成績為 $\\mu$ 且標準差為 $\\sigma$。若某生原始成績為 $S$，則他該科之 T 分數為 $T=50+10\\times\\frac{S-\\mu}{\\sigma}$。已知某班期末數學和英文兩科的平均成績皆為 70，數學成績的標準差為 14，英文成績的標準差為 10。試選出正確的選項。","track":"A","unit":"六"},{"answer":"(4)(5)","chapter":"數據分析","concept":"平均數、中位數、標準差、相關係數","explanation":["(1) 體重由小到大為 55,58,60,63,64，中位數 60；平均數 $=\\frac{300}{5}=60$，平均數等於中位數，錯誤；","(2) 體脂肪由小到大為 27,30,33,35,40，中位數 33；平均數 $=\\frac{165}{5}=33$，平均數等於中位數，錯誤；","(3) 體脂肪與平均數 33 的差為 $-3,-6,0,2,7$，標準差 $=\\sqrt{\\frac{9+36+0+4+49}{5}}=\\sqrt{19.6}\\approx4.43>4$，錯誤；","(4) 全體數據平移不改變離散程度，標準差不變，正確；","(5) 體重遞增時體脂肪大致遞增，相關係數 $r\\approx0.84>0$，為正相關，正確。","觀念回顧：數據平移（加減常數）不改變標準差與相關係數；伸縮（乘除正數）標準差同倍伸縮，相關係數不變。"],"hasFigure":false,"id":"u6b_1","options":["(1) 五人體重的平均數大於體重之中位數","(2) 五人體脂肪的平均數小於體脂肪之中位數","(3) 五人體脂肪的標準差小於 4（單位：%）","(4) 若五人每位減重 2 公斤，則減重後體重的標準差與減重前相同","(5) 五人的體重和體脂肪呈現正相關"],"source":"110 試辦學科能力測驗 數學B","stem":"五位好友 A、B、C、D 和 E 的體重及體脂肪數據如下：體重（kg）：A 55、B 58、C 60、D 63、E 64；體脂肪（%）：A 30、B 27、C 33、D 35、E 40。根據上述數據，試選出正確的選項。","track":"B","unit":"六"},{"answer":"(1)(2)(3)(4)","chapter":"數據分析","concept":"線性變換的平均數與標準差","explanation":["設原始平均 $\\bar{x}$、標準差 $s_x$，調整後 $\\bar{y}=a\\bar{x}+b$、$s_y=|a|s_x$。","甲：$\\bar{x}_1=\\frac{70-10}{0.9}=66.67$，$s_{x_1}=\\frac{18}{0.9}=20$；乙：$\\bar{x}_2=\\frac{70-15}{0.85}=64.71$，$s_{x_2}=\\frac{16}{0.85}=18.82$。","(1) $y_1-x_1=10-0.1x_1\\geq0$（$x_1\\leq100$），故 $y_1\\geq x_1$，正確；","(2) $66.67>64.71$，正確；","(3) $20>18.82$，正確；","(4) 兩調整線交於 $x=100$；$x<100$ 時 $y_2>y_1$。若 $x_{1A}\\leq x_{2B}$，則 $y_{1A}\\leq y_1(x_{2B})<y_2(x_{2B})=y_{2B}$，故 $y_{1A}>y_{2B}$ 必 $x_{1A}>x_{2B}$，正確；","(5) 僅知平均與標準差無法斷定分數分布，不及格人數無必然關係，錯誤。","觀念回顧：$y=ax+b$ 則 $\\bar{y}=a\\bar{x}+b$、$s_y=|a|s_x$；$a>0$ 時單調遞增保序。"],"hasFigure":false,"id":"u6b_2","options":["(1) 甲班每位同學調整後的分數均不低於其原始分數","(2) 甲班原始分數的平均比乙班原始分數的平均高","(3) 甲班原始分數的標準差比乙班原始分數的標準差高","(4) 若甲班 A 調整後分數比乙班 B 調整後分數高，則 A 的原始分數比 B 的原始分數高","(5) 若甲班調整後不及格人數比乙班多，則甲班原始不及格人數必比乙班多"],"source":"111 學年度學科能力測驗 數學B","stem":"甲、乙兩班各有 40 位同學參加某次數學考試（總分 100 分），考試後分別以 $y_1=0.9x_1+10$ 和 $y_2=0.85x_2+15$ 調整分數，其中 $x_1,x_2$ 為原始分數，$y_1,y_2$ 為調整後分數。已知調整後兩班平均均為 70 分，標準差分別為 18 分和 16 分。試選出正確的選項。","track":"B","unit":"六"},{"answer":"(1)(3)(4)","chapter":"數據分析","concept":"中位數、成長率","explanation":["(1) 2020 年旅客從 1050 萬降至 300 萬，為大量減少的一年，正確；","(2) 各年增加量：2023 年增加 $800-500=300$ 萬為最多，不是 2022 年（150 萬），錯誤；","(3) 14 筆數據由小到大為 300,350,500,550,600,650,720,780,800,830,900,950,1000,1050，中位數 $=\\frac{720+780}{2}=750<800$，正確；","(4) 2023 年成長率 $=\\frac{800-500}{500}=60\\%>30\\%$，正確；","(5) 2022 年成長率 $=\\frac{150}{350}\\approx42.9\\%$，2023 年為 $60\\%$ 更高，故不是 2022 年最高，錯誤。","觀念回顧：中位數為排序後中間值（偶數筆取中間兩數平均）；成長率分母為前一年數值，注意基期不同。"],"hasFigure":false,"id":"u6b_3","options":["(1) 旅客數大量減少的那一年是 2020 年","(2) 旅客人數比前一年增加最多的是 2022 年","(3) 2010 年到 2023 年旅客人數的中位數小於 800 萬人","(4) 2023 年旅客人數的成長率超過 30%","(5) 旅客人數的成長率以 2022 年為最高"],"source":"111 學年度參考試卷 數學B","stem":"下表是 2010 年到 2023 年國外來臺灣的旅客人數（以萬人計）。這幾年來臺旅客數幾乎逐年增加，其中 2020 年因疫情旅客數大量減少，之後才又逐年增加。2010：550、2011：600、2012：650、2013：720、2014：780、2015：830、2016：900、2017：950、2018：1000、2019：1050、2020：300、2021：350、2022：500、2023：800。（註：成長率＝（當年－前一年）÷前一年×100%）根據上述資料，試選出正確選項。","track":"B","unit":"六"},{"answer":"(3)","chapter":"數據分析","concept":"百分位數","explanation":["百分位數 $P_{70}$ 表示有 70% 的數據小於該數值，反映的是數據間的「順序」關係。","調整公式 $y=1.2x-10$ 中 $1.2>0$，為嚴格遞增函數，故原始分數的順序與調整後分數的順序完全一致。","小明原始贏過 70% 的同學，調整後仍贏過同樣的 70% 同學，故百分位數不變，仍為 $P_{70}$。","觀念回顧：嚴格單調遞增變換保序，故百分位數、中位數、四分位數等順序統計量不變；平均數、標準差則會改變。"],"hasFigure":false,"id":"u6b_4","options":["(1) $P_{58}$","(2) $P_{64}$","(3) $P_{70}$","(4) $P_{74}$","(5) $P_{84}$"],"source":"112 學年度學科能力測驗 數學B","stem":"某次期中考，全班 50 人。老師將原始分數 $x$ 以 $y=1.2x-10$ 調整為新分數 $y$。已知小明原始分數的百分位數為 $P_{70}$（即全班有 70% 的同學原始分數低於小明）。試問小明調整後分數的百分位數為下列哪一個選項？","track":"B","unit":"六"},{"answer":"(3)","chapter":"數據分析","concept":"百分位數","explanation":["將 120 筆數據由小到大排列：$1,2,2,3,3,3,\\cdots,15,15,\\cdots,15$。","$120\\times0.8=96$，故第 80 百分位數為第 96 筆與第 97 筆數據的平均值。","持有不超過 $k$ 顆的累積人數為 $1+2+\\cdots+k=\\frac{k(k+1)}{2}$。","$k=13$ 時累積 91 人，$k=14$ 時累積 105 人，故第 92 至 105 筆皆為 14。","第 96 筆與第 97 筆都是 14，平均為 14。","觀念回顧：第 $P$ 百分位數：$n\\times\\frac{P}{100}$ 若為整數 $m$，取第 $m$、$m+1$ 筆平均；若不為整數則無條件進位取該筆。"],"hasFigure":false,"id":"u6b_5","options":["(1) 12","(2) 13","(3) 14","(4) 15","(5) 16"],"source":"113 學年度學科能力測驗 數學B","stem":"某遊戲共有 120 位玩家，每位玩家均持有寶石，其中持有 1 顆的有 1 位，持有 2 顆的有 2 位，依此類推，持有 15 顆寶石的有 15 位。試問這些玩家每人持有寶石數量的第 80 百分位數為下列哪一個選項？","track":"B","unit":"六"},{"answer":"(2)","chapter":"數據分析","concept":"次數分配表的邏輯解讀","explanation":["城市最高溫 $=\\max$(東區，西區)。","$A$：東區 30 天皆 $\\geq24$，故城市每天 $\\geq24$，$A=0$。","$D$：城市 $\\geq36$ iff 東區 $\\geq36$（西區從未 $\\geq36$），故 $D=8$。","設某天東區在 $[24,30)$ 且西區在 $[30,36)$，則城市在 $[30,36)$。令此類天數為 $n\\geq0$。","東區 12 天在 $[30,36)$，這些天城市必在 $[30,36)$，故 $C=12+n\\geq12$。","東區 10 天在 $[24,30)$，其中 $n$ 天因西區較高而城市升至 $[30,36)$，故 $B=10-n\\leq10$。","檢驗選項：(1) $B=11>10$ 不合；(3) $B=12>10$ 不合；(4) $A=2\\neq0$ 不合；(5) $D=9\\neq8$ 不合。唯 (2) $(0,9,13,8)$ 滿足 $A=0,D=8,B\\leq10,C\\geq12,B+C=22$。","觀念回顧：取最大值的邏輯：低區間人數為零則整體低區間為零；高區間由單側決定。"],"hasFigure":false,"id":"u6b_6","options":["(1) $(0,11,11,8)$","(2) $(0,9,13,8)$","(3) $(0,12,10,8)$","(4) $(2,8,12,8)$","(5) $(0,8,14,9)$"],"source":"113 學年度學科能力測驗 數學B","stem":"有一城市分為東、西兩區。兩區各有一個氣溫偵測站，該城市當天的最高溫（單位：攝氏度）是取這兩區當天氣溫的最大值來記錄。下表顯示東、西兩區某月（共 30 天）每日最高溫分布的情形。東區（天數）：$18\\leq t<24$：0、$24\\leq t<30$：10、$30\\leq t<36$：12、$36\\leq t$：8；西區（天數）：$18\\leq t<24$：4、$24\\leq t<30$：10、$30\\leq t<36$：16、$36\\leq t$：0。根據上表，該城市當月每日最高溫分布為：$18\\leq t<24$：$A$ 天、$24\\leq t<30$：$B$ 天、$30\\leq t<36$：$C$ 天、$36\\leq t$：$D$ 天。試選出有可能為數組 $(A,B,C,D)$ 的選項。","track":"B","unit":"六"},{"answer":"(1)(2)(5)","chapter":"數據分析","concept":"平均數、標準差的判讀","explanation":["(1) 四人平均為 1.3,1.4,1.8,1.3，丙 1.8 最多，正確；","(2) 總用時 $=$ 次數 $\\times$ 平均：甲 26、乙 22.4、丙 32.4、丁 32.5 秒，丁最多，正確；","(3) 甲、丁平均雖同為 1.3 秒，但標準差不同（$0.6\\neq0.5$），每次用時不可能完全相同，錯誤；","(4) 僅知標準差無法斷定全距（最大值與最小值之差），錯誤；","(5) 若乙每次都在 1.3 到 1.5 秒之間，則與平均 1.4 的差至多 0.1，標準差至多 0.1，與 0.2 矛盾，故不可能，正確。","觀念回顧：總量 $=$ 次數 $\\times$ 平均；標準差反映離散程度，不能反推全距；數據有界時標準差有上界。"],"hasFigure":false,"id":"u6b_7","options":["(1) 丙每次殺球用時的平均是四位中最多的","(2) 丁花在殺球的總用時是四位中最多的","(3) 甲每次殺球的用時都與丁相同","(4) 甲每次殺球用時的全距大於丁每次殺球用時的全距","(5) 乙各次殺球的用時不可能都在 1.3 到 1.5 秒之間"],"source":"114 學年度學科能力測驗 數學B","stem":"某羽球選手與甲、乙、丙、丁四位選手各比賽一場。賽後統計該選手的對手在比賽中殺球的總次數，以及每次殺球用時的平均及標準差，結果如下：甲：20 次、平均 1.3 秒、標準差 0.6 秒；乙：16 次、平均 1.4 秒、標準差 0.2 秒；丙：18 次、平均 1.8 秒、標準差 0.3 秒；丁：25 次、平均 1.3 秒、標準差 0.5 秒。根據上述，試選出正確的選項。","track":"B","unit":"六"},{"answer":"(1)(4)","chapter":"數據分析","concept":"標準差、相關係數、迴歸直線","explanation":["A 濃度的標準差 $=\\sqrt{400}=20$。$B=0.4A$，故 B 的標準差 $=0.4\\times20=8$，(1) 正確；","中位數經線性變換仍為線性關係，但身長的中位數與 A、B 濃度的中位數沒有必然關聯，(2) 錯誤；","$B=0.4A$ 為完全正線性關係，相關係數為 1 不是 0.4，(3) 錯誤；","迴歸直線必通過平均點 $(70,60)$，故 $X=70$ 時預測 $Y=60$，(4) 正確；","B 對身長的迴歸斜率 $=r\\cdot\\frac{s_B}{s_X}=0.8\\times\\frac{8}{12}=\\frac{8}{15}\\neq\\frac{1}{2}$，(5) 錯誤。","觀念回顧：$Y=aX+b$ 則 $s_Y=|a|s_X$、$r$ 不變（$a>0$）；迴歸直線過 $(\\bar{x},\\bar{y})$；斜率 $=r\\frac{s_y}{s_x}$。"],"hasFigure":false,"id":"u6b_8","options":["(1) B 濃度的標準差為 8 單位","(2) 若身長的中位數為 70 單位，則 B 濃度的中位數為 24 單位","(3) B 濃度與 A 濃度的相關係數為 0.4","(4) 若找到一身長為 70 單位的昆蟲，利用 A 濃度對身長的迴歸直線預測，其體內 A 濃度為 60 單位","(5) B 濃度（$Y$）對身長（$X$）的迴歸直線斜率為 $\\frac{1}{2}$"],"source":"115 學年度學科能力測驗 數學B","stem":"某研究探討昆蟲的身長與其體內兩種養分 A、B 濃度的關係。測得身長與 A 濃度的數據如下：身長：平均數 70 單位、變異數 144 平方單位；A 濃度：平均數 60 單位、變異數 400 平方單位；身長與 A 濃度的相關係數為 0.8。已知每隻昆蟲體內的 B 濃度均為 A 濃度的 0.4 倍。試選出正確的選項。","track":"B","unit":"六"},{"answer":"1/5 < p < 3/10","chapter":"數據分析","concept":"列聯表","explanation":["設有近視且有蛀牙者占 $a$。則無近視且有蛀牙者占 $\\frac{2}{5}-a$，有近視且無蛀牙者占 $\\frac{3}{5}-a$。","無近視者總和 $\\frac{2}{5}=(\\frac{2}{5}-a)+p$，得 $p=a$。","有近視者中有蛀牙占少數：$\\frac{a}{3/5}<\\frac{1}{2}$，得 $a<\\frac{3}{10}$。","有蛀牙者中有近視占多數：$\\frac{a}{2/5}>\\frac{1}{2}$，得 $a>\\frac{1}{5}$。","故 $\\frac{1}{5}<a<\\frac{3}{10}$，即 $\\frac{1}{5}<p<\\frac{3}{10}$。","觀念回顧：列聯表中各格加總須等於邊際和；「占少數」指比例 $<\\frac{1}{2}$，「占多數」指 $>\\frac{1}{2}$。"],"hasFigure":false,"id":"u6b_9","options":[],"source":"115 學年度學科能力測驗 數學B","stem":"某校健康檢查：全體學生中有近視的占 $\\frac{3}{5}$、有蛀牙的占 $\\frac{2}{5}$。設 $p$ 為全體學生中無近視且無蛀牙的學生所占比例。將部分資料依所占比例以列聯表呈現如下：有蛀牙者總和為 $\\frac{2}{5}$，無蛀牙者總和為 $\\frac{3}{5}$；有近視者總和為 $\\frac{3}{5}$，無近視者總和為 $\\frac{2}{5}$；無近視且無蛀牙者占 $p$。已知有近視的學生中，有蛀牙的占少數；有蛀牙的學生中，有近視的占多數。則 $p$ 的範圍為何？（以 $a<p<b$ 的形式作答）","track":"B","unit":"六"},{"id":"u7a_1","unit":"七","chapter":"三角比","track":"A","source":"改編自 110 試辦數 A 第 9 題","concept":"三角形邊長關係與正弦定理","stem":"在 $\\triangle ABC$ 中，已知 $\\overline{AB}=3$，$\\overline{AC}=5$，且 $\\overline{BC}=a$，試選出正確的選項。","options":["(1) $a>2$","(2) 若 $\\triangle ABC$ 為鈍角三角形，則 $a>\\sqrt{34}$","(3) 可以找到一個 $a$，使得 $\\angle B<\\angle A<\\angle C$","(4) 可以找到一個 $a$，使得 $\\triangle ABC$ 的外接圓半徑為 2","(5) 可以找到一個 $a$，使得 $\\triangle ABC$ 的外接圓半徑為 2021"],"answer":"(1)(5)","explanation":["(1) 由三角形兩邊之差小於第三邊：$a>5-3=2$。正確。","(2) 鈍角條件有兩種：若 $a$ 為最長邊，則 $a^2>3^2+5^2=34$，即 $a>\\sqrt{34}$；但若 $5$ 為最長邊，則 $25>a^2+9$，即 $2<a<4$。只說 $a>\\sqrt{34}$ 並不充分。錯誤。","(3) 因為 $\\overline{AC}>\\overline{AB}$，由大邊對大角知 $\\angle B>\\angle C$ 恆成立，故 $\\angle B<\\angle A<\\angle C$ 不可能。錯誤。","(4) 由正弦定理 $R=\\frac{5}{2\\sin B}\\geq \\frac{5}{2}>2$，故外接圓半徑不可能為 $2$。錯誤。","(5) 當 $\\angle B$ 趨近於 $0$ 時，$R=\\frac{5}{2\\sin B}$ 可任意大，故可為 $2021$。正確。","觀念回顧：三角形邊長關係（兩邊和大於第三邊、兩邊差小於第三邊）；鈍角三角形判別（最長邊平方與另兩邊平方和比較）；正弦定理 $\\frac{a}{\\sin A}=2R$。"],"hasFigure":true},{"id":"u7a_2","unit":"七","chapter":"三角比","track":"A","source":"改編自 110 試辦數 A 第 17 題","concept":"向量內積與法向量","stem":"設 $P$、$Q$、$R$、$S$ 為空間中正四面體的四個頂點，另有一點 $T$ 與點 $S$ 分別在 $\\triangle PQR$ 所在平面的兩側，且（向量內積）$\\overrightarrow{TP}\\cdot\\overrightarrow{PQ}=0$，$\\overrightarrow{TP}\\cdot\\overrightarrow{PR}=0$。則 $\\cos\\angle SPT=$ ______。","options":[],"answer":"-√6/3","explanation":["由 $\\overrightarrow{TP}\\cdot\\overrightarrow{PQ}=\\overrightarrow{TP}\\cdot\\overrightarrow{PR}=0$ 知 $\\overrightarrow{TP}$ 同時垂直 $\\overrightarrow{PQ}$、$\\overrightarrow{PR}$，故 $\\overrightarrow{TP}$ 垂直於平面 $PQR$，即 $\\overrightarrow{TP}$ 為平面 $PQR$ 的法向量。","建立坐標系：令 $P=(0,0,0)$、$Q=(1,1,0)$、$R=(0,1,1)$、$S=(1,0,1)$（可驗證為正四面體，邊長皆為 $\\sqrt{2}$）。","$\\overrightarrow{TP}$ 平行於 $\\overrightarrow{PQ}\\times\\overrightarrow{PR}=(1,-1,1)$，故可設 $\\overrightarrow{TP}=k(1,-1,1)$。","$\\cos\\angle SPT=\\frac{\\overrightarrow{PS}\\cdot\\overrightarrow{TP}}{|\\overrightarrow{PS}||\\overrightarrow{TP}|}=\\frac{2k}{\\sqrt{2}\\cdot\\sqrt{3}|k|}=\\pm\\frac{\\sqrt{6}}{3}$。","因 $T$ 與 $S$ 在平面 $PQR$ 的兩側，$\\angle SPT$ 為鈍角，故取負值：$\\cos\\angle SPT=-\\frac{\\sqrt{6}}{3}$。","觀念回顧：向量內積為 $0$ 表示垂直；兩不平行向量的外積為其公垂向量；異側條件決定夾角為鈍角。"],"hasFigure":true},{"id":"u7a_3","unit":"七","chapter":"三角比","track":"A","source":"改編自 111 學測數 A 第 8 題","concept":"餘弦定理與正弦定理","stem":"坐標平面上，$\\triangle ABC$ 三頂點的坐標分別為 $A(1,3)$、$B(2,1)$、$C(5,2)$，試選出正確的選項。","options":["(1) $\\triangle ABC$ 的三邊中，$\\overline{AC}$ 最長","(2) $\\sin A<\\sin C$","(3) $\\triangle ABC$ 為銳角三角形","(4) $\\sin B=\\frac{7\\sqrt{2}}{10}$","(5) $\\triangle ABC$ 的外接圓半徑比 2 小"],"answer":"(1)(4)","explanation":["先算三邊長：$\\overline{AB}=\\sqrt{5}$，$\\overline{AC}=\\sqrt{17}$，$\\overline{BC}=\\sqrt{10}$。","(1) $\\sqrt{17}>\\sqrt{10}>\\sqrt{5}$，故 $\\overline{AC}$ 最長。正確。","(2) 因 $\\overline{BC}>\\overline{AB}$，大邊對大角得 $\\angle A>\\angle C$，且兩角皆為銳角（最大角為 $\\angle B$），故 $\\sin A>\\sin C$。錯誤。","(3) $(\\sqrt{17})^2=17>5+10=(\\sqrt{5})^2+(\\sqrt{10})^2$，故 $\\angle B$ 為鈍角。錯誤。","(4) $\\cos B=\\frac{5+10-17}{2\\sqrt{5}\\sqrt{10}}=-\\frac{\\sqrt{2}}{10}$，故 $\\sin B=\\sqrt{1-\\frac{2}{100}}=\\frac{7\\sqrt{2}}{10}$。正確。","(5) 由正弦定理 $2R=\\frac{\\sqrt{17}}{\\sin B}=\\frac{5\\sqrt{34}}{7}$，得 $R=\\frac{5\\sqrt{34}}{14}\\approx 2.08>2$。錯誤。","觀念回顧：兩點距離公式；餘弦定理判斷銳鈍角（最長邊平方與另兩邊平方和比較）；正弦定理求外接圓半徑。"],"hasFigure":true},{"id":"u7a_4","unit":"七","chapter":"三角比","track":"A","source":"改編自 111 學測數 A 第 11 題","concept":"二面角與三角比","stem":"下圖為一個積木的示意圖，其中 $\\triangle ABC$ 為直角三角形，$\\angle ACB=90^{\\circ}$，$\\overline{AC}=6$，$\\overline{BC}=8$，且 $ADEB$ 與 $ADFC$ 皆為矩形。試選出正確的選項。","options":["(1) 將此積木沿平面 $ACE$ 切下，可切得兩個四面體","(2) 平面 $ADEB$ 與 $ADFC$ 所夾銳角大於 $45^{\\circ}$","(3) $\\angle CEB<\\angle AEB$","(4) $\\tan\\angle AEC<\\sin\\angle CEB$","(5) $\\angle CEB<\\angle AEC$"],"answer":"(2)(3)(4)","explanation":["(1) 沿平面 $ACE$ 切下，含 $B$ 的部分為四面體，另一部分有五個面，並非四面體。錯誤。","(2) 兩平面交線為 $\\overline{AD}$，分別作垂直於 $\\overline{AD}$ 的 $\\overline{AB}$、$\\overline{AC}$，其夾角即為二面角 $\\angle BAC$。$\\tan\\angle BAC=\\frac{8}{6}>1$，故 $\\angle BAC>45^{\\circ}$。正確。","(3) $\\triangle CEB$ 與 $\\triangle AEB$ 皆為直角三角形，共用 $\\overline{BE}$，且 $\\overline{BC}=8<10=\\overline{AB}$，故 $\\angle CEB<\\angle AEB$。正確。","(4) $\\tan\\angle AEC=\\frac{6}{EC}$，$\\sin\\angle CEB=\\frac{8}{CE}$，因 $6<8$，故 $\\tan\\angle AEC<\\sin\\angle CEB$。正確。","(5) 銳角的 $\\tan$ 值大於 $\\sin$ 值，由 (4) 得 $\\tan\\angle AEC<\\sin\\angle CEB<\\tan\\angle CEB$，故 $\\angle AEC<\\angle CEB$。錯誤。","觀念回顧：二面角的定義（在交線上取一點，作兩條分別垂直交線的直線，其夾角）；直角三角形邊角關係；銳角 $\\theta$ 恆有 $\\sin\\theta<\\tan\\theta$。"],"hasFigure":true},{"id":"u7a_5","unit":"七","chapter":"三角比","track":"A","source":"改編自 111 學測數 A 第 15 題","concept":"相似三角形面積比與三角比","stem":"如圖，王家有塊三角形土地 $\\triangle ABC$，其中 $\\overline{BC}=20$ 公尺。政府擬徵收其中梯形 $DBCE$ 部分，開闢以直線 $DE$、$BC$ 為邊線的馬路，其路寬為 $h$ 公尺，這讓王家土地只剩原有面積的 $\\frac{25}{36}$。經協商，改以開闢平行直線 $BE$、$FC$ 為邊線的馬路，且路寬不變，其中 $\\angle EBC=30^{\\circ}$，則只需徵收 $\\triangle BCE$ 區域。依此協商，王家剩餘的土地 $\\triangle ABE$ 有 ______ 平方公尺。","options":[],"answer":"500","explanation":["由 $\\triangle ADE$ 面積占 $\\triangle ABC$ 的 $\\frac{25}{36}$，且 $DE//BC$，得相似比 $\\overline{AD}:\\overline{AB}=5:6$，故 $\\overline{AD}:\\overline{DB}=5:1$，且 $\\overline{AE}:\\overline{EC}=5:1$。","過 $C$ 作 $\\overline{BC}$ 的垂線，得 $30^{\\circ}$-$60^{\\circ}$-$90^{\\circ}$ 三角形，路寬 $h=20\\times\\sin 30^{\\circ}=10$（公尺）。","$\\triangle BCE$ 的面積 $=\\frac{1}{2}\\times 20\\times 10=100$（平方公尺）。","$\\triangle ABE$ 與 $\\triangle CBE$ 共用頂點 $B$，底邊 $\\overline{AE}$、$\\overline{CE}$ 在同一直線上，故面積比 $=\\overline{AE}:\\overline{CE}=5:1$，得 $\\triangle ABE$ 面積 $=5\\times 100=500$（平方公尺）。","觀念回顧：相似三角形面積比等於邊長平方比；$30^{\\circ}$-$60^{\\circ}$-$90^{\\circ}$ 三角形邊長比 $1:\\sqrt{3}:2$；同高三角形面積比等於底邊比。"],"hasFigure":true},{"id":"u7a_6","unit":"七","chapter":"三角比","track":"A","source":"改編自 111 學測數 A 第 19 題","concept":"極坐標與畢氏定理","stem":"令 $O$ 為原點，掃描棒停止時黑、白兩端所在位置分別為 $A'$、$B'$（如圖，小圓半徑為 $2$，掃描棒長為 $2\\sqrt{3}$，$B'=(-4,0)$）。試求 $\\cos\\angle OA'B'$ 及點 $A'$ 的極坐標。","options":[],"answer":"cos∠OA'B'=0, A'極坐標[2, 120°]","explanation":["掃描棒長不變，故 $\\overline{A'B'}=2\\sqrt{3}$；$A'$ 在小圓上，故 $\\overline{OA'}=2$；$\\overline{OB'}=4$。","檢查：$2^2+(2\\sqrt{3})^2=4+12=16=4^2$，故 $\\triangle OA'B'$ 為直角三角形，直角在 $A'$。","因此 $\\cos\\angle OA'B'=\\cos 90^{\\circ}=0$。","又 $\\sin\\angle A'OB'=\\frac{2\\sqrt{3}}{4}=\\frac{\\sqrt{3}}{2}$，得 $\\angle A'OB'=60^{\\circ}$。$A'$ 在第二象限，故極坐標為 $[2,120^{\\circ}]$。","觀念回顧：畢氏定理逆定理判斷直角三角形；極坐標 $[r,\\theta]$ 中 $\\theta$ 為自 $x$ 軸正向逆時針旋轉的角度。"],"hasFigure":true},{"id":"u7a_7","unit":"七","chapter":"三角比","track":"A","source":"改編自 111 參考數 A 第 16 題","concept":"正弦定理與和角公式","stem":"已知銳角三角形 $\\triangle ABC$ 中，$\\overline{AB}=4$ 且 $\\overline{AC}=8$。若 $\\triangle ABC$ 的外接圓半徑為 $\\frac{8\\sqrt{14}}{7}$，則 $\\overline{BC}=$ ______。","options":[],"answer":"6√2","explanation":["由正弦定理：$\\sin C=\\frac{4}{2R}=\\frac{\\sqrt{14}}{8}$，$\\sin B=\\frac{8}{2R}=\\frac{\\sqrt{14}}{4}$。","因 $\\triangle ABC$ 為銳角三角形，$\\cos B$、$\\cos C$ 皆為正數：$\\cos B=\\sqrt{1-\\frac{14}{16}}=\\frac{\\sqrt{2}}{4}$，$\\cos C=\\sqrt{1-\\frac{14}{64}}=\\frac{5\\sqrt{2}}{8}$。","$\\sin A=\\sin(B+C)=\\sin B\\cos C+\\cos B\\sin C=\\frac{\\sqrt{14}}{4}\\cdot\\frac{5\\sqrt{2}}{8}+\\frac{\\sqrt{2}}{4}\\cdot\\frac{\\sqrt{14}}{8}=\\frac{3\\sqrt{7}}{8}$。","再由正弦定理：$\\overline{BC}=2R\\sin A=\\frac{16\\sqrt{14}}{7}\\times\\frac{3\\sqrt{7}}{8}=6\\sqrt{2}$。","觀念回顧：正弦定理 $\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R$；和角公式 $\\sin(B+C)=\\sin B\\cos C+\\cos B\\sin C$；銳角三角形的餘弦值為正。"],"hasFigure":true},{"id":"u7a_8","unit":"七","chapter":"三角比","track":"A","source":"改編自 112 學測數 A 第 2 題","concept":"圓的切線與三角比","stem":"坐標平面上，以原點 $O$ 為圓心、$2$ 為半徑作圓。在第一象限的圓弧上取一點 $C$ 作圓的切線分別交兩軸於點 $D$、$E$，如圖所示。令 $\\angle OEC=\\theta$，試選出為 $\\tan\\theta$ 的選項。","options":["(1) $\\overline{OE}$","(2) $\\overline{OC}$","(3) $\\overline{OD}$","(4) $\\overline{CE}$","(5) $\\frac{\\overline{CD}}{2}$"],"answer":"(5)","explanation":["要求 $\\tan\\theta$，應從包含 $\\theta$ 的直角三角形下手。","在 $Rt\\triangle OCE$ 中，$\\tan\\theta=\\frac{\\overline{OC}}{\\overline{CE}}=\\frac{2}{\\overline{CE}}$，無此選項。","注意到 $\\angle OCD=90^{\\circ}-\\angle OCE=\\theta$（餘角關係）。在 $Rt\\triangle OCD$ 中，$\\tan\\theta=\\frac{\\overline{CD}}{\\overline{OC}}=\\frac{\\overline{CD}}{2}$。故選 (5)。","（參考：$\\sin\\theta=\\frac{2}{\\overline{OE}}$，$\\cos\\theta=\\frac{2}{\\overline{OD}}$，$\\frac{1}{\\tan\\theta}=\\frac{\\overline{CE}}{2}$。）","觀念回顧：圓的切線垂直於過切點的半徑；餘角的三角比關係；直角三角形中 $\\tan=$ 對邊／鄰邊。"],"hasFigure":true},{"id":"u7a_9","unit":"七","chapter":"三角比","track":"A","source":"改編自 112 學測數 A 第 18 題","concept":"等腰三角形與三角比","stem":"坐標平面上 $O$ 為原點，給定 $A(2,0)$、$B(-3,0)$ 兩點。另有兩點 $P$、$Q$ 在上半平面，且滿足 $\\overline{AP}=\\overline{OA}$、$\\overline{BQ}=\\overline{OB}$、$\\angle POQ$ 為直角，如圖所示。令 $\\angle AOP=\\theta$。試問線段 $\\overline{OP}$ 長為下列哪一選項？","options":["(1) $\\sin\\theta$","(2) $\\cos\\theta$","(3) $2\\sin\\theta$","(4) $4\\cos\\theta$","(5) $\\cos 2\\theta$"],"answer":"(4)","explanation":["因 $\\overline{AP}=\\overline{OA}=2$，故 $\\triangle OAP$ 為等腰三角形。作 $\\overline{AP}$ 邊上的高（即 $\\angle AOP$ 的角平分線），交 $\\overline{AP}$ 於 $R$，則 $\\overline{OR}=\\overline{OA}\\cos\\theta=2\\cos\\theta$。","由等腰三角形性質，$\\overline{OP}=2\\cdot\\overline{OR}=4\\cos\\theta$。故選 (4)。","觀念回顧：等腰三角形頂角的角平分線同時為底邊的高與中線；直角三角形中鄰邊 $=$ 斜邊 $\\times\\cos$ 夾角。"],"hasFigure":true},{"id":"u7a_10","unit":"七","chapter":"三角比","track":"A","source":"改編自 113 學測數 A 第 6 題","concept":"餘弦定理與倍角公式","stem":"在同一平面上，相距 $6$ 公里的 $A$、$B$ 兩砲台，$A$ 在 $B$ 的正東方。某次演習時，$A$ 向西偏北 $\\theta$ 方向發射砲彈，$B$ 則向東偏北 $\\theta$ 方向發射砲彈，其中 $\\theta$ 為銳角，觀測回報兩砲彈皆命中 $8$ 公里外的同一目標 $P$。接著 $A$ 改向西偏北 $2\\theta$ 方向發射砲彈，彈著點為 $8$ 公里外的點 $Q$。試問砲台 $B$ 與彈著點 $Q$ 的距離 $\\overline{BQ}$ 為何？","options":["(1) 11 公里","(2) 12 公里","(3) 13 公里","(4) 14 公里","(5) 15 公里"],"answer":"(3)","explanation":["由對稱性，$P$ 在 $\\overline{AB}$ 的中垂線上。在 $\\triangle ABP$ 中，$\\overline{AP}=\\overline{BP}=8$，$\\overline{AB}=6$，故 $\\cos\\theta=\\frac{3}{8}$。","由倍角公式，$\\cos 2\\theta=2\\cos^2\\theta-1=2\\times\\frac{9}{64}-1=-\\frac{23}{32}$。","在 $\\triangle ABQ$ 中，$\\angle BAQ=2\\theta$，由餘弦定理：$\\overline{BQ}^2=6^2+8^2-2\\times 6\\times 8\\times\\left(-\\frac{23}{32}\\right)=36+64+69=169$。","故 $\\overline{BQ}=13$（公里）。選 (3)。","觀念回顧：餘弦定理 $c^2=a^2+b^2-2ab\\cos C$；倍角公式 $\\cos 2\\theta=2\\cos^2\\theta-1$；等腰三角形的對稱性。"],"hasFigure":true},{"id":"u7a_11","unit":"七","chapter":"三角比","track":"A","source":"改編自 113 學測數 A 第 8 題","concept":"海龍公式與餘弦定理","stem":"對任一正整數 $n\\geq 3$，令 $T_n$ 表示邊長為 $n$、$n+2$、$n+4$ 的三角形。試選出正確的選項。（註：若三角形的三邊長分別為 $a$、$b$、$c$，令 $s=\\frac{a+b+c}{2}$，則三角形面積為 $\\sqrt{s(s-a)(s-b)(s-c)}$）","options":["(1) $T_n$ 皆為銳角三角形","(2) $T_3$、$T_4$、$T_5$、$\\cdots$、$T_{10}$ 的周長形成等差數列","(3) $T_n$ 的面積隨 $n$ 增大而增大","(4) $T_5$ 的三高依序形成等差數列","(5) $T_4$ 的最大角大於 $T_3$ 的最大角"],"answer":"(2)(3)","explanation":["先確認可圍成三角形：$n+(n+2)>n+4$ 得 $n>2$，故 $n\\geq 3$ 皆可。","(1) 最大角對最長邊 $n+4$。$n^2+(n+2)^2-(n+4)^2=n^2-4n-12=(n-6)(n+2)$。$n=3$ 時為負（鈍角），$n=6$ 時為 $0$（直角），故非皆為銳角。錯誤。","(2) 周長 $=3n+6$，$n=3,4,\\cdots,10$ 時為 $15,18,21,\\cdots,36$，公差為 $3$ 的等差數列。正確。","(3) $s=\\frac{3n+6}{2}$，面積 $=\\sqrt{s(s-n)(s-n-2)(s-n-4)}$。經計算 $n=3,4,5,\\cdots$ 時面積遞增（$6.50<11.62<17.41<\\cdots$）。正確。","(4) $T_5$ 邊長為 $5$、$7$、$9$，面積 $=\\sqrt{10.5\\times 5.5\\times 3.5\\times 1.5}\\approx 17.41$。三高分別為 $\\frac{2\\times 17.41}{5}\\approx 6.96$、$\\frac{2\\times 17.41}{7}\\approx 4.97$、$\\frac{2\\times 17.41}{9}\\approx 3.87$，不成等差。錯誤。","提示：三高為 $\\frac{2\\Delta}{5}$、$\\frac{2\\Delta}{7}$、$\\frac{2\\Delta}{9}$，判斷是否成等差時 $2\\Delta$ 可約去，只需檢查 $\\frac{1}{5}$、$\\frac{1}{7}$、$\\frac{1}{9}$ 是否成等差（$\\frac{2}{7}\\neq\\frac{14}{45}$，故不成等差）。","(5) $T_3$ 最大角 $=120^{\\circ}$（$\\cos=-\\frac{1}{2}$），$T_4$ 最大角 $\\approx 104.5^{\\circ}$，故 $T_4$ 的最大角小於 $T_3$。錯誤。","觀念回顧：海龍公式；最大角的餘弦值 $=\\frac{a^2+b^2-c^2}{2ab}$（$c$ 為最長邊），判別銳鈍角；高的比為邊長的倒數比。"],"hasFigure":false},{"id":"u7a_12","unit":"七","chapter":"三角比","track":"A","source":"改編自 114 學測數 A 第 17 題","concept":"圓周角與餘弦定理","stem":"$\\triangle ABC$ 中，已知 $\\overline{AB}=\\overline{BC}=4$，$\\cos\\angle ABC=-\\frac{1}{8}$。在 $\\triangle ABC$ 的外接圓上有一點 $D$ 滿足 $\\overline{BD}=5$，且 $\\overline{AD}$ 不大於 $\\overline{CD}$，則 $\\overline{CD}=$ ______。","options":[],"answer":"6","explanation":["$\\triangle ABC$ 為等腰三角形，$\\angle A=\\angle C$。由 $\\cos\\angle ABC=-\\frac{1}{8}$，得 $\\cos 2\\angle A=\\frac{1}{8}$，故 $\\cos^2\\angle A=\\frac{1+1/8}{2}=\\frac{9}{16}$，$\\cos\\angle A=\\frac{3}{4}$。","由圓周角性質，$\\angle BDC=\\angle BAC$，故 $\\cos\\angle BDC=\\frac{3}{4}$。","令 $\\overline{CD}=x$，在 $\\triangle BCD$ 中由餘弦定理（對 $\\overline{BC}$）：$16=25+x^2-2\\cdot 5\\cdot x\\cdot\\frac{3}{4}$，即 $2x^2-15x+18=0$，解得 $x=6$ 或 $x=\\frac{3}{2}$。","由圖形及 $\\overline{AD}$ 不大於 $\\overline{CD}$ 的條件，應取較大的 $x=6$。（經坐標驗算：$D$ 在圓上且 $\\overline{BD}=5$ 有兩解，分別對應 $\\overline{CD}=6$、$\\overline{AD}=1.5$ 及 $\\overline{CD}=1.5$、$\\overline{AD}=6$。）","觀念回顧：同弧所對的圓周角相等；餘弦定理；半形公式 $\\cos^2\\theta=\\frac{1+\\cos 2\\theta}{2}$。"],"hasFigure":true},{"id":"u7a_13","unit":"七","chapter":"三角比","track":"A","source":"改編自 115 學測數 A 第 17 題","concept":"正弦定理與倍角公式","stem":"直角 $\\triangle ABC$ 中，$\\angle CAB$ 為直角，$\\overline{AB}$ 邊上一點 $D$，滿足 $\\angle BCD=2\\angle ACD$，且 $\\overline{BC}=3\\overline{BD}$。若 $\\overrightarrow{AD}=k\\overrightarrow{AB}$，則 $k=$ ______。","options":[],"answer":"4/13","explanation":["令 $\\angle ACD=\\theta$，則 $\\angle BCD=2\\theta$。在 $\\triangle BCD$ 中由正弦定理：$\\frac{\\overline{BC}}{\\sin(90^{\\circ}-\\theta)}=\\frac{\\overline{BD}}{\\sin 2\\theta}$，得 $\\frac{\\overline{BC}}{\\overline{BD}}=\\frac{\\cos\\theta}{2\\sin\\theta\\cos\\theta}=\\frac{1}{2\\sin\\theta}=3$，故 $\\sin\\theta=\\frac{1}{6}$。","在 $Rt\\triangle ACD$ 中，設 $\\overline{CD}=6$，則 $\\overline{AD}=6\\sin\\theta=1$，$\\overline{AC}=6\\cos\\theta=\\sqrt{35}$。","令 $\\overline{BD}=x$，則 $\\overline{BC}=3x$。在 $Rt\\triangle ABC$ 中由畢氏定理：$(1+x)^2+35=9x^2$，即 $4x^2-x-18=0$，解得 $x=\\frac{9}{4}$（負根不合）。","故 $\\overline{AB}=1+\\frac{9}{4}=\\frac{13}{4}$，$k=\\frac{\\overline{AD}}{\\overline{AB}}=\\frac{1}{13/4}=\\frac{4}{13}$。","觀念回顧：正弦定理；倍角公式 $\\sin 2\\theta=2\\sin\\theta\\cos\\theta$；畢氏定理；向量共線時係數即為長度比。"],"hasFigure":true},{"id":"u7b_1","unit":"七","chapter":"三角比","track":"B","source":"改編自 110 試辦數 B 第 3 題","concept":"廣義角三角函數","stem":"已知標準位置角 $\\theta$ 滿足 $\\sin\\theta>\\cos\\theta$ 及 $\\sin\\theta\\cos\\theta<0$，試選出 $\\theta$ 所在的位置。","options":["(1) 第一象限","(2) 第二象限","(3) 第三象限","(4) 第四象限","(5) 位於坐標軸上"],"answer":"(2)","explanation":["由 $\\sin\\theta\\cos\\theta<0$ 知 $\\sin\\theta$ 和 $\\cos\\theta$ 異號；","又 $\\sin\\theta>\\cos\\theta$，故 $\\sin\\theta$ 為正數、$\\cos\\theta$ 為負數，滿足此關係的廣義角為第二象限角。","觀念回顧：$\\sin\\theta$ 看 $y$ 坐標（上正下負），$\\cos\\theta$ 看 $x$ 坐標（右正左負）；第二象限 $x$ 負、$y$ 正。"],"hasFigure":false},{"id":"u7b_2","unit":"七","chapter":"三角比","track":"B","source":"改編自 110 試辦數 B 第 5 題","concept":"正弦定理","stem":"已知 $\\triangle ABC$ 為銳角三角形，邊長 $BC=a$ 滿足 $\\sin A=2a\\sin B$，又其外接圓半徑為 $\\frac{1}{2}$，試選出 $\\angle B$ 的度數。","options":["(1) 15 度","(2) 30 度","(3) 45 度","(4) 60 度","(5) 75 度"],"answer":"(2)","explanation":["由正弦定理 $\\frac{a}{\\sin A}=2R$，代入 $\\sin A=2a\\sin B$、$R=\\frac{1}{2}$：$\\frac{a}{2a\\sin B}=2\\times\\frac{1}{2}=1$，即 $\\frac{1}{2\\sin B}=1$，得 $\\sin B=\\frac{1}{2}$。","$B$ 為銳角，故 $\\angle B=30$ 度。","觀念回顧：正弦定理 $\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R$，其中 $R$ 為外接圓半徑。"],"hasFigure":false},{"id":"u7b_3","unit":"七","chapter":"三角比","track":"B","source":"改編自 111 參考數 B 第 5 題","concept":"三角比定義","stem":"古代工匠知道將長方體磚塊以某個固定的角度相接就可砌出近似圓形的牆面，右圖是用 $12$ 塊長方體磚塊砌成一近似圓形的牆面，每塊長方體的長邊為 $1$ 單位，相鄰兩塊磚之間固定夾 $30^{\\circ}$ 角。試問此近似圓形牆面內部所能容納最大圓形的半徑是多少單位？","options":["(1) $\\cos 15^{\\circ}$","(2) $\\frac{1}{2\\cos 15^{\\circ}}$","(3) $\\frac{1}{2\\sin 15^{\\circ}}$","(4) $\\frac{1}{2\\tan 15^{\\circ}}$","(5) $\\tan 15^{\\circ}$"],"answer":"(4)","explanation":["此圖形為正十二邊形；內部所能容納的最大圓形即為其內切圓。","中心角為 $\\frac{360^{\\circ}}{12}=30^{\\circ}$，取半角 $15^{\\circ}$、半邊長 $\\frac{1}{2}$ 構成直角三角形。","由三角比定義 $\\tan 15^{\\circ}=\\frac{1/2}{r}$，故內切圓半徑 $r=1/(2\\tan 15^{\\circ})$。","觀念回顧：正 $n$ 邊形內切圓半徑 $=a/(2\\tan(180^{\\circ}/n))$，其中 $a$ 為邊長。"],"hasFigure":true},{"id":"u7b_4","unit":"七","chapter":"三角比","track":"B","source":"改編自 112 正式數 B 第 3 題","concept":"餘弦定義","stem":"地面上有甲、乙兩大樓，已知甲的高度大於乙，且甲、乙兩大樓的水平距離為 $200$ 公尺。某人從甲樓頂拉一條繩索到乙樓頂，並從甲樓頂測得乙樓頂的俯角為 $30^{\\circ}$。假設該繩索被拉成直線，試問繩索的長度（單位：公尺）最接近下列哪個選項？（註：眼睛往下看目標物時，視線與水平線間的夾角稱為俯角）","options":["(1) $200$","(2) $200\\sin 30^{\\circ}$","(3) $200\\cos 30^{\\circ}$","(4) $\\frac{200}{\\cos 30^{\\circ}}$","(5) $\\frac{200}{\\sin 30^{\\circ}}$"],"answer":"(4)","explanation":["如圖，由餘弦的定義：$\\cos 30^{\\circ}=200/L$，故繩長 $L=200/\\cos 30^{\\circ}$。","觀念回顧：直角三角形中，$\\cos\\theta=b/c$（$b$ 為鄰邊、$c$ 為斜邊）；俯角為視線與水平線往下的夾角。"],"hasFigure":true},{"id":"u7b_5","unit":"七","chapter":"三角比","track":"B","source":"改編自 115 正式數 B 第 13 題","concept":"正弦定理","stem":"坐標平面上，$L_1$ 為通過原點 $O$ 且斜角為 $75^{\\circ}$ 的直線；$L_2$ 為通過點 $(-30,0)$ 且斜角為 $45^{\\circ}$ 的直線，如圖所示。則 $L_1$、$L_2$ 的交點到原點的距離為 ______。（四捨五入至整數）","options":[],"answer":"42","explanation":["設 $L_1$、$L_2$ 交於 $B$，$A=(-30,0)$，則 $\\angle OAB=45^{\\circ}$，$\\angle AOB=180^{\\circ}-75^{\\circ}=105^{\\circ}$，故 $\\angle OBA=180^{\\circ}-105^{\\circ}-45^{\\circ}=30^{\\circ}$。","由正弦定理：$30/\\sin 30^{\\circ}=OB/\\sin 45^{\\circ}$，得 $OB=30\\times\\sin 45^{\\circ}/\\sin 30^{\\circ}=30\\sqrt{2}\\approx 42.4$，四捨五入得 $42$。","觀念回顧：直線的斜角為直線與 $x$ 軸正向的夾角；正弦定理 $a/\\sin A=b/\\sin B$。"],"hasFigure":true},{"id":"u8a_1","unit":"八","chapter":"三角函數","track":"A","source":"110 試辦數 A 第 6 題","concept":"正餘弦疊合與圖形交點","stem":"試問有多少個實數 $x$ 滿足 $\\sin 2x+\\cos 2x=\\sin x$，其中 $x$ 介於 $0$ 與 $2\\pi$ 之間（含兩端）？","options":["(1) 1 個","(2) 2 個","(3) 3 個","(4) 4 個","(5) 5 個"],"answer":"(4)","explanation":["先將左邊疊合：$\\sin 2x+\\cos 2x=\\sqrt{2}\\sin(2x+\\frac{\\pi}{4})$。","原方程式不好直接求解，改畫 $y=\\sin x$ 與 $y=\\sqrt{2}\\sin(2x+\\frac{\\pi}{4})$ 的圖形，數交點個數。","在 $0$ 與 $2\\pi$ 之間（含兩端），兩圖形共有 $4$ 個相異交點。","觀念回顧：正餘弦疊合 $a\\sin x+b\\cos x=\\sqrt{a^2+b^2}\\sin(x+\\phi)$；方程式的解即兩函數圖形的交點。"],"hasFigure":true},{"id":"u8a_2","unit":"八","chapter":"三角函數","track":"A","source":"111 學測數 A 第 20 題","concept":"扇形面積","stem":"令 $O$ 為原點。有一掃描棒，黑端在半徑為 $2\\sqrt{3}$ 的小圓 $C_1$ 上，白端在半徑為 $4$ 的大圓 $C_2$ 上，棒長固定為 $2$。初始時黑、白兩端分別在 $A=(2\\sqrt{3},0)$、$B=(2\\sqrt{3},2)$，掃描棒逆時針移動，直到白端到達 $B'=(-4,0)$（此時黑端在 $A'$）。令 $\\Omega$ 表示掃描棒在第一象限所掃過的區域，$R$ 表示掃描棒掃過的全部區域，如圖所示。試分別求 $\\Omega$ 與 $R$ 的面積。","options":[],"answer":"Ω面積為 2√3−π/3，R面積為 5π/3","explanation":["先求 $R$ 的面積。白端從 $B$（極角 $30^\\circ$）掃到 $B'$（極角 $180^\\circ$），共掃過 $150^\\circ$；黑端從 $A$（極角 $0^\\circ$）掃到 $A'$（極角 $150^\\circ$），亦掃過 $150^\\circ$。","$R=$ 大扇形 $-$ 小扇形 $=\\frac{1}{2}\\cdot 4^2\\cdot\\frac{5\\pi}{6}-\\frac{1}{2}\\cdot(2\\sqrt{3})^2\\cdot\\frac{5\\pi}{6}=\\frac{20\\pi}{3}-5\\pi=\\frac{5\\pi}{3}$。","再求 $\\Omega$。設 $T_1,T_2$ 分別為小圓、大圓與 $y$ 軸的交點，則 $\\Omega=\\triangle OAB+$ 扇形 $OBT_2-$ 扇形 $OAT_1$。","$\\triangle OAB$ 面積 $=\\frac{1}{2}\\cdot 2\\sqrt{3}\\cdot 2=2\\sqrt{3}$；扇形 $OBT_2=\\frac{1}{2}\\cdot 16\\cdot\\frac{\\pi}{3}=\\frac{8\\pi}{3}$；扇形 $OAT_1=\\frac{1}{2}\\cdot 12\\cdot\\frac{\\pi}{2}=3\\pi$。","故 $\\Omega=2\\sqrt{3}+\\frac{8\\pi}{3}-3\\pi=2\\sqrt{3}-\\frac{\\pi}{3}$。","觀念回顧：扇形面積 $=\\frac{1}{2}r^2\\theta$（$\\theta$ 為弧度）；掃過區域可由扇形相加減求得。"],"hasFigure":true},{"id":"u8a_3","unit":"八","chapter":"三角函數","track":"A","source":"111 參考數 A 第 12 題","concept":"正餘弦疊合","stem":"設函數 $f(x)=\\sin x+\\sqrt{3}\\sin(x-\\frac{\\pi}{2})$，其中 $x$ 為任意實數，試選出正確的選項。","options":["(1) $f(\\frac{5\\pi}{6})=2$","(2) $f(x)$ 的最小值為 $-3$","(3) $f(x)$ 的最大值為 $2$","(4) $f(x)$ 的週期為 $\\pi$","(5) $y=f(x)$ 的圖形經平移後可與 $y=\\cos x$ 的圖形重合"],"answer":"(1)(3)","explanation":["先用餘角關係：$\\sin(x-\\frac{\\pi}{2})=-\\cos x$，接著疊合：$f(x)=\\sin x-\\sqrt{3}\\cos x=2\\sin(x-\\frac{\\pi}{3})$。","(1) $f(\\frac{5\\pi}{6})=\\sin\\frac{5\\pi}{6}-\\sqrt{3}\\cos\\frac{5\\pi}{6}=\\frac{1}{2}+\\frac{3}{2}=2$。正確。","(2) 振幅為 $2$，最小值為 $-2$，不是 $-3$。錯誤。","(3) 最大值為 $2$。正確。","(4) 週期為 $2\\pi$，不是 $\\pi$。錯誤。","(5) $f(x)$ 振幅為 $2$，$y=\\cos x$ 振幅為 $1$，平移無法改變振幅。錯誤。","觀念回顧：餘角關係 $\\sin(x-\\frac{\\pi}{2})=-\\cos x$；疊合 $a\\sin x+b\\cos x=\\sqrt{a^2+b^2}\\sin(x+\\phi)$；正弦函數的極值、週期與振幅。"],"hasFigure":false},{"id":"u8a_4","unit":"八","chapter":"三角函數","track":"A","source":"112 學測數 A 第 12 題","concept":"正弦函數圖形的對稱軸","stem":"令 $f(x)=\\sqrt{3}\\sin x+\\cos x$，試選出正確的選項。","options":["(1) 鉛直線 $x=\\frac{\\pi}{3}$ 為 $y=f(x)$ 圖形的對稱軸","(2) 若鉛直線 $x=a$ 和 $x=b$ 均為 $y=f(x)$ 圖形的對稱軸，則 $f(a)=f(b)$","(3) 在區間 $[0,2\\pi)$ 中僅有一個實數 $x$ 滿足 $f(x)=\\sqrt{3}$","(4) 在區間 $[0,2\\pi)$ 中滿足 $f(x)=-\\sqrt{3}$ 的所有實數 $x$ 之和不超過 $2\\pi$","(5) $y=f(x)$ 的圖形可由 $y=4\\sin^2\\frac{x}{2}$ 的圖形經適當（左右、上下）平移得到"],"answer":"(1)(5)","explanation":["疊合：$f(x)=\\sqrt{3}\\sin x+\\cos x=2\\sin(x+\\frac{\\pi}{6})$。","(1) $x+\\frac{\\pi}{6}=\\frac{\\pi}{2}$ 得 $x=\\frac{\\pi}{3}$ 為極大值點，即對稱軸。正確。","(2) 對稱軸有無限多條，相鄰兩對稱軸一為極大、一為極小，函數值不相等。錯誤。","(3) $2\\sin(x+\\frac{\\pi}{6})=\\sqrt{3}$ 在 $[0,2\\pi)$ 中有兩解。錯誤。","(4) $2\\sin(x+\\frac{\\pi}{6})=-\\sqrt{3}$ 的兩解為 $x=\\frac{7\\pi}{6},\\frac{3\\pi}{2}$，和為 $\\frac{8\\pi}{3}>2\\pi$。錯誤。","(5) $y=4\\sin^2\\frac{x}{2}=2-2\\cos x$，振幅為 $2$、週期為 $2\\pi$，與 $f(x)$ 相同，故可平移而得。正確。","觀念回顧：正弦函數圖形的對稱軸通過極值點；$\\sin^2\\frac{x}{2}=\\frac{1-\\cos x}{2}$（半形公式）。"],"hasFigure":true},{"id":"u8a_5","unit":"八","chapter":"三角函數","track":"A","source":"112 學測數 A 第 19 題","concept":"等腰三角形與向量","stem":"坐標平面上 $O$ 為原點，給定 $A(2,0)$、$B(-4,0)$ 兩點。另有兩點 $P$、$Q$ 在上半平面，且滿足 $\\overline{AP}=\\overline{OA}$、$\\overline{BQ}=\\overline{OB}$、$\\angle POQ$ 為直角，如圖所示。令 $\\angle AOP=\\theta$。若 $\\sin\\theta=\\frac{3}{5}$，試求點 $Q$ 的坐標，並說明向量 $\\overrightarrow{BQ}=2\\overrightarrow{AP}$。","options":[],"answer":"Q(−72/25，96/25)，向量BQ＝2向量AP","explanation":["$\\sin\\theta=\\frac{3}{5}$，則 $\\cos\\theta=\\frac{4}{5}$。由等腰三角形性質，$\\overline{OP}=2\\cdot\\overline{OA}\\cos\\theta=\\frac{16}{5}$，$\\overline{OQ}=2\\cdot\\overline{OB}\\sin\\theta=\\frac{24}{5}$。","$P$ 的極角為 $\\theta$：$P=\\frac{16}{5}(\\cos\\theta,\\sin\\theta)=(\\frac{64}{25},\\frac{48}{25})$。","$Q$ 的極角為 $90^\\circ+\\theta$：$Q=\\frac{24}{5}(-\\sin\\theta,\\cos\\theta)=(-\\frac{72}{25},\\frac{96}{25})$。","向量 $\\overrightarrow{AP}=(\\frac{64}{25}-2,\\frac{48}{25})=(\\frac{14}{25},\\frac{48}{25})$，向量 $\\overrightarrow{BQ}=(-\\frac{72}{25}+4,\\frac{96}{25})=(\\frac{28}{25},\\frac{96}{25})=2\\overrightarrow{AP}$。故 $\\overrightarrow{BQ}=2\\overrightarrow{AP}$，亦得 $\\overline{BQ}=2\\overline{AP}$。","觀念回顧：等腰三角形中，底邊上的高即頂角的角平分線；向量相等則長度相等且方向相同。"],"hasFigure":true},{"id":"u8a_6","unit":"八","chapter":"三角函數","track":"A","source":"113 學測數 A 第 4 題","concept":"和角公式與疊合","stem":"試問有多少個實數 $x$ 滿足 $\\sin(x+\\frac{\\pi}{3})=\\sin x+\\sin\\frac{\\pi}{3}$，其中 $x$ 介於 $0$ 與 $2\\pi$ 之間（包含 $0$，不包含 $2\\pi$）？","options":["(1) 1 個","(2) 2 個","(3) 3 個","(4) 4 個","(5) 5 個（含）以上"],"answer":"(2)","explanation":["展開左邊：$\\sin x\\cos\\frac{\\pi}{3}+\\cos x\\sin\\frac{\\pi}{3}=\\sin x+\\sin\\frac{\\pi}{3}$，即 $\\frac{1}{2}\\sin x+\\frac{\\sqrt{3}}{2}\\cos x=\\sin x+\\frac{\\sqrt{3}}{2}$。","整理得 $-\\frac{1}{2}\\sin x+\\frac{\\sqrt{3}}{2}\\cos x=\\frac{\\sqrt{3}}{2}$，疊合為 $\\cos(x+\\frac{\\pi}{6})=\\frac{\\sqrt{3}}{2}$。","在 $0$ 與 $2\\pi$ 之間（包含 $0$，不包含 $2\\pi$），$x+\\frac{\\pi}{6}=\\frac{\\pi}{6}$ 或 $\\frac{11\\pi}{6}$，得 $x=0$ 或 $x=\\frac{5\\pi}{3}$，共兩個實數解。","觀念回顧：和角公式 $\\sin(A+B)=\\sin A\\cos B+\\cos A\\sin B$；疊合後由振幅判斷解的個數。"],"hasFigure":false},{"id":"u8a_7","unit":"八","chapter":"三角函數","track":"A","source":"114 學測數 A 第 5 題","concept":"二倍角公式","stem":"設 $\\theta$ 介於 $0$ 與 $2\\pi$ 之間（含兩端），已知所有滿足 $\\sin 2\\theta<\\sin\\theta$ 且 $\\cos 2\\theta>\\cos\\theta$ 的 $\\theta$ 可表為 $a\\pi<\\theta<b\\pi$，其中 $a,b$ 為實數，試問 $b-a$ 的值為何？","options":["(1) $\\frac{1}{3}$","(2) $\\frac{1}{2}$","(3) $\\frac{2}{3}$","(4) $\\frac{3}{4}$","(5) $1$"],"answer":"(1)","explanation":["先用二倍角公式整理：$\\sin 2\\theta<\\sin\\theta$ 即 $\\sin\\theta(2\\cos\\theta-1)<0$……①；$\\cos 2\\theta>\\cos\\theta$ 即 $(2\\cos\\theta+1)(\\cos\\theta-1)>0$……②。","看②：$\\cos\\theta-1$ 恆不大於 $0$，故欲使②成立，應有 $2\\cos\\theta+1<0$，即 $\\cos\\theta<-\\frac{1}{2}$。在 $0$ 與 $2\\pi$ 之間，滿足此式的 $\\theta$ 範圍為 $\\frac{2\\pi}{3}<\\theta<\\frac{4\\pi}{3}$。","再看①：已知 $\\cos\\theta<-\\frac{1}{2}$，故 $2\\cos\\theta-1<0$，欲使①成立應有 $\\sin\\theta>0$。結合得 $\\frac{2\\pi}{3}<\\theta<\\pi$。","故 $a=\\frac{2}{3}$，$b=1$，$b-a=\\frac{1}{3}$。","觀念回顧：二倍角公式 $\\sin 2\\theta=2\\sin\\theta\\cos\\theta$，$\\cos 2\\theta=2\\cos^2\\theta-1$；解不等式時注意因式的正負。"],"hasFigure":false},{"id":"u8a_8","unit":"八","chapter":"三角函數","track":"A","source":"114 學測數 A 第 10 題","concept":"正弦圖形的對稱性與週期性","stem":"令 $\\Gamma$ 為坐標平面上 $y=\\sin\\frac{\\pi x}{2}$ 在 $x$ 介於 $0$ 與 $6$ 之間（含兩端）之函數圖形。一水平直線 $L:y=k$ 與 $\\Gamma$ 相交，其中三交點 $P(x_1,k)$，$Q(x_2,k)$，$R(x_3,k)$ 滿足 $x_1<x_2<2<x_3$。試選出正確的選項。","options":["(1) $k>0$","(2) $L$ 與 $\\Gamma$ 恰有 $3$ 個交點","(3) $x_1+x_2<2$","(4) 若 $2\\overline{PQ}=\\overline{QR}$，則 $k=\\frac{1}{2}$","(5) $L$ 與 $\\Gamma$ 所有交點的 $x$ 坐標之和大於 $10$"],"answer":"(1)(4)(5)","explanation":["$y=\\sin\\frac{\\pi x}{2}$ 的週期為 $4$，因此 $x$ 介於 $0$ 與 $6$ 之間是 $1.5$ 個週期，作圖如上。","(1) 若 $k<0$ 則交點僅 $2$ 個；若 $k=0$ 則 $x_2=2$ 不合，故 $k>0$。正確。","(2) 由圖知共有 $4$ 個交點。錯誤。","(3) $x=1$ 處為波峰，$x_1,x_2$ 對 $x=1$ 對稱，得 $x_1+x_2=2$。錯誤。","(4) 由(3)，$x_2=2-x_1$；由週期性 $x_3=x_1+4$。$2\\overline{PQ}=\\overline{QR}$ 即 $2(x_2-x_1)=x_3-x_2$，代入得 $2(2-2x_1)=2x_1+2$，解得 $x_1=\\frac{1}{3}$，$k=\\sin\\frac{\\pi}{6}=\\frac{1}{2}$。正確。","(5) 已知 $x_1+x_2=2$；第四個交點記為 $x_4$，由週期性 $x_3+x_4=2+8=10$。故四交點 $x$ 坐標之和 $=12>10$。正確。","觀念回顧：正弦圖形的對稱性（波峰為對稱軸）；週期性可用來找後續交點。"],"hasFigure":true},{"id":"u8a_9","unit":"八","chapter":"三角函數","track":"A","source":"115 學測數 A 第 11 題","concept":"餘弦圖形與直線交點","stem":"令 $\\Gamma$ 為坐標平面上 $y=2\\cos\\frac{\\pi x}{2}$ 的圖形。對任一實數 $m\\neq 0$，以 $L_m$ 表示直線 $y=mx+2$。試選出正確的選項。","options":["(1) $m>0$ 時，$L_m$ 和 $\\Gamma$ 交點的 $x$ 坐標皆為負","(2) 若 $(a,b)$ 為 $L_m$ 和 $\\Gamma$ 的交點，則 $(-a,b)$ 為 $L_{-m}$ 和 $\\Gamma$ 的交點","(3) 可以找到一實數 $m\\neq 0$ 使得 $L_m$ 和 $\\Gamma$ 交於點 $(\\frac{20}{3},1)$","(4) 若 $L_m$ 與 $\\Gamma$ 有一交點在直線 $y=-2$ 上，則 $\\frac{1}{m}$ 是奇數","(5) 若 $L_m$ 與 $\\Gamma$ 有一交點在 $x$ 軸上，則 $L_m$ 與 $\\Gamma$ 有偶數個交點"],"answer":"(2)","explanation":["先抓振幅與週期：$y=2\\cos\\frac{\\pi x}{2}$ 振幅為 $2$，週期為 $4$；$L_m:y=mx+2$ 是通過 $(0,2)$ 且斜率為 $m$ 的直線。","(1) 兩圖形必相交於 $(0,2)$，故交點 $x$ 坐標不可能皆為負。錯誤。","(2) $(a,b)$ 與 $(-a,b)$ 對稱於 $y$ 軸；$L_m$ 與 $L_{-m}$ 對稱於 $y$ 軸，$\\Gamma$ 也對稱於 $y$ 軸，故交點亦對稱於 $y$ 軸。正確。","(3) $x=\\frac{20}{3}$ 代入得 $y=2\\cos\\frac{10\\pi}{3}=-1\\neq 1$，故 $(\\frac{20}{3},1)$ 不在 $\\Gamma$ 上。錯誤。","(4) 設交點為 $(a,-2)$，則 $\\cos\\frac{\\pi a}{2}=-1$ 得 $a=2+4k$（$k$ 為整數）；又 $-2=ma+2$ 得 $m=\\frac{-4}{2+4k}=\\frac{-2}{2k+1}$，故 $\\frac{1}{m}=-\\frac{2k+1}{2}$ 恆為半整數，不可能是奇數。錯誤。","(5) 取 $m=-2$，則 $L_{-2}$ 通過 $(0,2)$ 且交 $x$ 軸於 $(1,0)$（在 $\\Gamma$ 上）；此時兩圖形共有 $3$ 個交點，為奇數。錯誤。","觀念回顧：餘弦圖形對稱於 $y$ 軸；直線與三角函數圖形的交點個數可用圖形判斷。"],"hasFigure":true},{"id":"u8b_1","unit":"八","chapter":"三角函數","track":"B","source":"111 學測數 B 第 6 題","concept":"弧長公式與緯度","stem":"假設地球為一半徑 $r$ 的球體，有一質點自甲地沿著該地所在經線往北移動，抵達北極點時移動所經過的弧線之長度為 $\\frac{5\\pi r}{12}$（如圖）。試問哪一個選項最可能是甲地的位置？","options":["(1) 東經 $75^\\circ$、北緯 $15^\\circ$","(2) 東經 $30^\\circ$、南緯 $75^\\circ$","(3) 東經 $75^\\circ$、南緯 $15^\\circ$","(4) 西經 $30^\\circ$、北緯 $75^\\circ$","(5) 西經 $15^\\circ$、南緯 $30^\\circ$"],"answer":"(1)","explanation":["弧長公式 $s=r\\theta$（$\\theta$ 為弧度量），得 $\\theta=\\frac{5\\pi}{12}$。","$\\frac{5\\pi}{12}=75^\\circ$，即甲地在北極點以南 $75^\\circ$ 處，緯度為 $90^\\circ-75^\\circ=15^\\circ$（北緯）。經線方向不影響緯度計算。","觀念回顧：弧長 $s=r\\theta$（$\\theta$ 用弧度）；緯度由赤道起算，北極為北緯 $90^\\circ$。"],"hasFigure":true},{"id":"u8b_2","unit":"八","chapter":"三角函數","track":"B","source":"111 學測數 B 第 18 題","concept":"角度與弧度換算","stem":"瘦長的塔因為年代久遠，塔身容易傾斜。在右圖中，以粗黑線條代表塔身，塔身的長度稱為塔高，塔身與鉛直虛線的夾角 $\\theta^\\circ$ 稱為該塔的傾斜度（$0\\leq\\theta<90$），又塔頂至鉛直虛線的距離稱為該塔的偏移距離。已知某古塔的傾斜度達到 $15^\\circ$，此傾斜度換算成弳（或弧度）為下列哪一個選項？","options":["(1) $\\frac{\\pi}{36}$","(2) $\\frac{\\pi}{18}$","(3) $\\frac{\\pi}{15}$","(4) $\\frac{\\pi}{12}$","(5) $\\frac{\\pi}{9}$"],"answer":"(4)","explanation":["$180^\\circ=\\pi$（弧度），故 $15^\\circ=15\\times\\frac{\\pi}{180}=\\frac{\\pi}{12}$。","觀念回顧：角度轉弧度乘以 $\\frac{\\pi}{180}$；弧度轉角度乘以 $\\frac{180}{\\pi}$。"],"hasFigure":true},{"id":"u8b_3","unit":"八","chapter":"三角函數","track":"B","source":"111 學測數 B 第 19 題","concept":"正弦函數的遞增性","stem":"（承上題圖）三座著名斜塔，它們的塔高分別為 $36$、$24$ 與 $45$（公尺），偏移距離分別為 $1.8$、$2.4$ 與 $3.6$（公尺），塔的傾斜度分別記為 $\\theta_1^\\circ$、$\\theta_2^\\circ$ 與 $\\theta_3^\\circ$。試比較 $\\theta_1$、$\\theta_2$ 與 $\\theta_3$ 三數的大小關係。","options":[],"answer":"θ2＞θ3＞θ1","explanation":["由圖可知，$\\sin\\theta$ 等於偏移距離除以塔高。","$\\sin\\theta_1=\\frac{1.8}{36}=0.05$，$\\sin\\theta_2=\\frac{2.4}{24}=0.1$，$\\sin\\theta_3=\\frac{3.6}{45}=0.08$。","在 $0^\\circ$ 到 $90^\\circ$ 範圍內正弦函數為遞增，故 $\\theta_2>\\theta_3>\\theta_1$。","觀念回顧：$\\sin\\theta$ 等於對邊除以斜邊；正弦函數在 $[0^\\circ,90^\\circ]$ 遞增。"],"hasFigure":true},{"id":"u8b_4","unit":"八","chapter":"三角函數","track":"B","source":"111 學測數 B 第 20 題","concept":"三角函數的平方關係","stem":"（承上題圖）假設有塔高相等的兩座鐵塔，它們的傾斜度 $\\alpha^\\circ$、$\\beta^\\circ$ 分別滿足 $\\sin\\alpha^\\circ=\\frac{3}{5}$ 與 $\\sin\\beta^\\circ=\\frac{4}{5}$。已知兩座鐵塔的偏移距離相差 $12$ 公尺，試求它們的塔頂到地面之距離相差多少公尺。","options":[],"answer":"12 公尺","explanation":["設塔高為 $h$。偏移距離 $=h\\sin\\theta$，由 $|h\\sin\\alpha^\\circ-h\\sin\\beta^\\circ|=12$ 得 $h|\\frac{3}{5}-\\frac{4}{5}|=12$，即 $h\\cdot\\frac{1}{5}=12$，故 $h=60$。","塔頂到地面距離 $=h\\cos\\theta$。$\\cos\\alpha^\\circ=\\frac{4}{5}$，$\\cos\\beta^\\circ=\\frac{3}{5}$。","所求 $=60|\\frac{4}{5}-\\frac{3}{5}|=60\\cdot\\frac{1}{5}=12$（公尺）。","觀念回顧：$\\sin^2\\theta+\\cos^2\\theta=1$；塔頂高度 $=h\\cos\\theta$。"],"hasFigure":true},{"id":"u8b_5","unit":"八","chapter":"三角函數","track":"B","source":"111 參考數 B 第 12 題","concept":"正弦函數的振幅與週期","stem":"運輸船進港卸貨時間會受到水深的影響，水深夠深時才能進港卸貨。某人測量某海港某日 $24$ 小時之時間 $t$（單位：時）與水深 $h$（單位：公尺）的關係，下表為其當日凌晨 $0{:}00$ 到中午 $12{:}00$ 的部分數據。$0{:}00\\to 10$，$3{:}00\\to 13$，$6{:}00\\to 10$，$9{:}00\\to 7$，$12{:}00\\to 10$ 根據上表，當日此海港的水深與測量時間符合正弦函數 $h=a\\sin(bt)+10$，其中 $a>0$、$b>0$。依此正弦函數模型，試選出正確的選項。","options":["(1) 當日的 $18{:}00$ 與 $24{:}00$ 的水深相同","(2) 若運輸船可在下午某時間進港卸貨，則最好的時間點約為 $15{:}00$","(3) 水深大約每 $6$ 小時循環一次","(4) 此正弦函數的振幅 $a>2$","(5) $b=\\frac{\\pi}{6}$"],"answer":"(1)(2)(4)(5)","explanation":["由數據：每 $12$ 小時水深回到 $10$（平衡點），$3{:}00$ 為波峰 $13$，$9{:}00$ 為波谷 $7$，故週期為 $12$ 小時。","振幅 $a=13-10=3$；$\\sin(bt)$ 週期 $=\\frac{2\\pi}{b}=12$，得 $b=\\frac{\\pi}{6}$。","(1) $18{:}00$ 與 $24{:}00$ 水深皆為 $10$，正確。(2) 水深最深在 $15{:}00$（波峰），正確。(3) 週期為 $12$ 小時，錯誤。(4) $a=3>2$，正確。(5) $b=\\frac{\\pi}{6}$，正確。","觀念回顧：$y=a\\sin(bx)+k$ 的振幅為 $a$ 的絕對值，週期為 $2\\pi$ 除以 $b$ 的絕對值，平衡線為 $y=k$。"],"hasFigure":true},{"id":"u8b_6","unit":"八","chapter":"三角函數","track":"B","source":"114 學測數 B 第 19 題","concept":"正弦函數的週期","stem":"已知某日某地的日照時數（日出到日落）恰為 $12$ 小時，且該地當天日出後 $x$ 小時（$0\\leq x\\leq 12$）的 UVI 數值，可用函數 $f(x)=a\\sin(bx)$ 來表示，其中 $a,b>0$。假設日照時 UVI 數值為正，非日照時 UVI 數值為 $0$（即 $f(0)=f(12)=0$），且當天日出後 $3$ 小時的 UVI 數值為 $5$。試求 $a$、$b$ 之值。","options":[],"answer":"a＝5√2，b＝π/12","explanation":["$f(0)=f(12)=0$ 且中間為正，表示半個週期為 $12$，故週期為 $24$。由 $\\frac{2\\pi}{b}=24$ 得 $b=\\frac{\\pi}{12}$。","$f(3)=a\\sin(3\\cdot\\frac{\\pi}{12})=a\\sin\\frac{\\pi}{4}=a\\cdot\\frac{\\sqrt{2}}{2}=5$，得 $a=5\\sqrt{2}$。","觀念回顧：正弦函數 $\\sin(bx)$ 的週期為 $\\frac{2\\pi}{b}$；$\\sin\\frac{\\pi}{4}=\\frac{\\sqrt{2}}{2}$。"],"hasFigure":true},{"id":"u8b_7","unit":"八","chapter":"三角函數","track":"B","source":"114 學測數 B 第 20 題","concept":"正弦函數的不等式","stem":"承上題（$f(x)=5\\sqrt{2}\\sin(\\frac{\\pi x}{12})$），今某人要在該日 UVI 數值介於 $5$ 和 $5\\sqrt{3}$ 之間（含）時做日光浴。將他可以做日光浴的時間設為日出後 $t$ 小時，試求 $t$ 的最大可能範圍。","options":[],"answer":"t∈[3,9]","explanation":["UVI 介於 $5$ 和 $5\\sqrt{3}$ 之間，即 $5\\sqrt{2}\\sin\\frac{\\pi t}{12}$ 介於 $5$ 和 $5\\sqrt{3}$ 之間。得 $\\sin\\frac{\\pi t}{12}$ 介於 $\\frac{\\sqrt{2}}{2}$ 和 $\\sqrt{\\frac{3}{2}}$ 之間。但 $\\sin\\frac{\\pi t}{12}\\leq 1<\\sqrt{\\frac{3}{2}}$，上界恆成立，故只需 $\\sin\\frac{\\pi t}{12}\\geq\\frac{\\sqrt{2}}{2}$。在 $[0,12]$ 內得 $\\frac{\\pi t}{12}\\in[\\frac{\\pi}{4},\\frac{3\\pi}{4}]$，即 $t\\in[3,9]$。","觀念回顧：$\\sin\\theta=\\frac{\\sqrt{2}}{2}$ 時 $\\theta=45^\\circ$ 或 $135^\\circ$；注意 $\\sin\\theta\\leq 1$，上界超過 $1$ 時恆成立。"],"hasFigure":true},{"id":"u8b_8","unit":"八","chapter":"三角函數","track":"B","source":"115 學測數 B 第 8 題","concept":"正弦函數的週期與振幅","stem":"試選出與函數 $y=4\\sin(\\frac{\\pi}{3}x+\\pi)+2$ 在每個實數 $x$ 所得函數值皆相同的函數。","options":["(1) $y=8\\sin(\\frac{\\pi}{3}x)+2$","(2) $y=4\\sin((\\frac{\\pi}{3}+2\\pi)x+\\pi)+2$","(3) $y=4\\sin(\\frac{\\pi}{3}x-\\pi)+2$","(4) $y=-4\\sin(\\frac{\\pi}{3}x)-2$","(5) $y=-4\\sin(\\frac{\\pi}{3}x)+2$"],"answer":"(3)(5)","explanation":["原函數週期 $=\\frac{2\\pi}{\\pi/3}=6$，振幅為 $4$。(1) 振幅為 $8$，刪去；(2) 週期 $=\\frac{2\\pi}{\\pi/3+2\\pi}\\neq 6$，刪去。","利用 $\\sin(\\theta+\\pi)=-\\sin\\theta$：(3) $4\\sin(\\frac{\\pi}{3}x-\\pi)+2=4\\sin(\\frac{\\pi}{3}x+\\pi)+2$（相差 $2\\pi$），符合；(5) $-4\\sin(\\frac{\\pi}{3}x)+2=4\\sin(\\frac{\\pi}{3}x+\\pi)+2$，符合；(4) 常數項為 $-2$，不合。","觀念回顧：$\\sin(\\theta+\\pi)=-\\sin\\theta$；$\\sin$ 週期為 $2\\pi$；$y=a\\sin(bx)+k$ 振幅 $|a|$、週期 $\\frac{2\\pi}{|b|}$。"],"hasFigure":false},{"id":"u9a_1","unit":"九","chapter":"指數與對數函數","track":"A","source":"110 試辦數 A 第 1 題","concept":"對數律與真數比較","stem":"試問 $\\log(3+2\\sqrt{2})$，$\\log(3-2\\sqrt{2})$，$-\\log(3+2\\sqrt{2})$，$-\\log(3-2\\sqrt{2})$，$\\log 2+\\log 3$ 這五個數中共有多少個不同的實數？","options":["(1) 1 個","(2) 2 個","(3) 3 個","(4) 4 個","(5) 5 個"],"answer":"(3)","explanation":["利用對數律化簡：$-\\log(3+2\\sqrt{2})=\\log(3+2\\sqrt{2})^{-1}=\\log\\frac{1}{3+2\\sqrt{2}}$。","因為 $(3+2\\sqrt{2})(3-2\\sqrt{2})=9-8=1$，所以 $\\frac{1}{3+2\\sqrt{2}}=3-2\\sqrt{2}$，故 $-\\log(3+2\\sqrt{2})=\\log(3-2\\sqrt{2})$。","同理 $-\\log(3-2\\sqrt{2})=\\log(3+2\\sqrt{2})$。又 $\\log 2+\\log 3=\\log 6$，而 $6$ 與 $3+2\\sqrt{2}$、$3-2\\sqrt{2}$ 都不相等，取 $\\log$ 後也不相等。","因此五個數中共有 $3$ 個不同的實數。","觀念回顧：$\\log a+\\log b=\\log ab$；$-\\log a=\\log a^{-1}$；真數不同則對數值不同。"],"hasFigure":false},{"id":"u9a_2","unit":"九","chapter":"指數與對數函數","track":"A","source":"110 試辦數 A 第 15 題","concept":"指數函數的遞增性與二次函數極值","stem":"已知 $a>1$，且當 $0\\leq x\\leq 2$ 時，$y=a^{2x^2-6x+5}$ 的最小值為 $\\frac{4}{3}$，則 $a=$ ______。","options":[],"answer":"16/9","explanation":["因為 $a>1$，指數愈大函數值愈大，只需先求指數 $2x^2-6x+5$ 在 $0\\leq x\\leq 2$ 的最小值。","配方法得 $2x^2-6x+5=2(x-\\frac{3}{2})^2+\\frac{1}{2}\\geq\\frac{1}{2}$，當 $x=\\frac{3}{2}$ 時有最小值 $\\frac{1}{2}$。","故 $y$ 的最小值為 $a^{1/2}=\\frac{4}{3}$，解得 $a=(\\frac{4}{3})^2=\\frac{16}{9}$。","觀念回顧：$a>1$ 時 $y=a^x$ 為遞增函數；二次函數配方法求極值。"],"hasFigure":false},{"id":"u9a_3","unit":"九","chapter":"指數與對數函數","track":"A","source":"111 學測數 A 第 2 題","concept":"換底公式","stem":"計算機在計算 $\\log_a b$ 時需依序按 $\\log$、$a$、$b$。某生在計算 $\\log_a b$ 時（其中 $a>1$ 且 $b>1$）順序弄錯，誤按成 $\\log_b a$，所得為正確值的 $\\frac{25}{16}$ 倍。試選出 $a$、$b$ 間的關係式。","options":["(1) $a^{4/5}=b$","(2) $a^{5/4}=b$","(3) $a^{16/25}=b$","(4) $a^4=5b$","(5) $5a=4b$"],"answer":"(1)","explanation":["依題意 $\\log_b a=\\frac{25}{16}\\log_a b$。換底得 $\\frac{\\log a}{\\log b}=\\frac{25}{16}\\cdot\\frac{\\log b}{\\log a}$，即 $(\\frac{\\log a}{\\log b})^2=\\frac{25}{16}$。","因 $a>1$ 且 $b>1$，$\\log a$ 與 $\\log b$ 皆為正數，故 $\\frac{\\log a}{\\log b}=\\frac{5}{4}$，即 $\\log a=\\frac{5}{4}\\log b=\\log b^{5/4}$，得 $a=b^{5/4}$，亦即 $b=a^{4/5}$。","觀念回顧：換底公式 $\\log_a b=\\frac{\\log b}{\\log a}$；$\\log a^n=n\\log a$。"],"hasFigure":false},{"id":"u9a_4","unit":"九","chapter":"指數與對數函數","track":"A","source":"111 學測數 A 第 4 題","concept":"等差中項與對數律","stem":"設等差數列 $\\{a_n\\}$ 之首項 $a_1$ 與公差 $d$ 皆為正數，且 $\\log a_1$，$\\log a_2$，$\\log a_4$ 依序也成等差數列。試選出數列 $\\log a_1$，$\\log a_2$，$\\log a_4$ 的公差。","options":["(1) $\\log d$","(2) $\\log 2$","(3) $\\log 3$","(4) $\\log 2d$","(5) $\\log 3d$"],"answer":"(2)","explanation":["由等差中項：$2\\log a_2=\\log a_1+\\log a_4$，即 $\\log a_2^2=\\log(a_1a_4)$，得 $a_2^2=a_1a_4$。","代入 $a_2=a_1+d$、$a_4=a_1+3d$：$(a_1+d)^2=a_1(a_1+3d)$，展開得 $d^2=a_1d$，因 $d>0$，故 $a_1=d$。","所求公差 $=\\log a_2-\\log a_1=\\log\\frac{a_1+d}{a_1}=\\log\\frac{2d}{d}=\\log 2$。","觀念回顧：等差中項 $2b=a+c$；$\\log a-\\log b=\\log\\frac{a}{b}$。"],"hasFigure":false},{"id":"u9a_5","unit":"九","chapter":"指數與對數函數","track":"A","source":"111 參考數 A 第 3 題","concept":"等比級數和與對數估計位數","stem":"第 $1$ 天獲得 $1$ 元、第 $2$ 天獲得 $2$ 元、第 $3$ 天獲得 $4$ 元、第 $4$ 天獲得 $8$ 元，依此每天所獲得的錢為前一天的兩倍，如此進行到第 $40$ 天，試問這 $40$ 天所獲得的錢之總數最接近下列哪一個選項？","options":["(1) $10^8$ 元","(2) $10^{10}$ 元","(3) $10^{11}$ 元","(4) $10^{12}$ 元","(5) $10^{14}$ 元"],"answer":"(4)","explanation":["$40$ 天總共獲得 $1+2+4+\\cdots+2^{39}$，用等比級數公式得 $\\frac{1\\cdot(2^{40}-1)}{2-1}=2^{40}-1$。","用 $\\log$ 估計 $2^{40}$ 的大小：$\\log(2^{40})=40\\log 2\\approx 40\\times 0.301=12.04$，所以 $2^{40}\\approx 10^{12}$，是一個十三位數，故選 (4)。","觀念回顧：等比級數和 $\\frac{a_1(r^n-1)}{r-1}$；$\\log 2\\approx 0.3010$；位數 $=[\\log N]+1$。"],"hasFigure":false},{"id":"u9a_6","unit":"九","chapter":"指數與對數函數","track":"A","source":"111 參考數 A 第 4 題","concept":"對數律的應用","stem":"設 $x$ 與 $y$ 的關係式為 $y=6\\times\\log(\\frac{x}{4})^3$，且當 $x=x_1$、$x_2$ 時，其對應的 $y$ 值分別為 $y_1$、$y_2$，其中 $x_1$、$x_2$ 為正實數。若 $x_2=2x_1$，則對於 $y_1$、$y_2$ 的關係，試選出正確的選項。","options":["(1) $y_2=2y_1$","(2) $y_2=y_1^3$","(3) $y_2=18\\times\\log y_1$","(4) $y_2=y_1+\\log 2$","(5) $y_2=y_1+18\\times\\log 2$"],"answer":"(5)","explanation":["利用對數律計算：$y_2=6\\times\\log(\\frac{x_2}{4})^3=18\\times\\log(\\frac{x_2}{4})$。","代入 $x_2=2x_1$：$y_2=18\\times\\log(\\frac{2x_1}{4})=18\\times(\\log 2+\\log\\frac{x_1}{4})=18\\times\\log 2+y_1$。","觀念回顧：$\\log a^n=n\\log a$；$\\log(ab)=\\log a+\\log b$。"],"hasFigure":false},{"id":"u9a_7","unit":"九","chapter":"指數與對數函數","track":"A","source":"111 參考數 A 第 8 題","concept":"位數與 10 的次方不等式","stem":"已知正整數 $a$ 與正整數 $b$ 的乘積是 $13$ 位數，而 $a$ 除以 $b$ 的商之整數部分是 $4$ 位數，則 $a$ 可能為幾位數？","options":["(1) 6 位數","(2) 7 位數","(3) 8 位數","(4) 9 位數","(5) 10 位數"],"answer":"(3)(4)","explanation":["「$N$ 是 $13$ 位數」即 $10^{12}\\leq N<10^{13}$；「商的整數部分是 $4$ 位數」即 $10^3\\leq\\frac{a}{b}<10^4$。","兩式相乘得 $10^{15}\\leq a^2<10^{17}$，開平方得 $10^{7.5}\\leq a<10^{8.5}$，所以 $a$ 可能是 $8$ 位數或 $9$ 位數。","觀念回顧：「$N$ 是 $k$ 位數」等價於 $10^{k-1}\\leq N<10^k$；位數問題可轉化為 $10$ 的次方的不等式。"],"hasFigure":false},{"id":"u9a_8","unit":"九","chapter":"指數與對數函數","track":"A","source":"112 學測數 A 第 9 題","concept":"等比數列與交錯級數","stem":"設 $a_1,a_2,\\cdots,a_n$ 是首項為 $2$ 且公比為 $2\\sqrt{2}$ 的等比數列。試選出滿足不等式 $\\log_2 a_1-\\log_2 a_2+\\log_2 a_3-\\cdots+(-1)^{n+1}\\log_2 a_n>15$ 的項數 $n$ 之可能選項。","options":["(1) 19","(2) 20","(3) 21","(4) 22","(5) 23"],"answer":"(3)(5)","explanation":["$a_k=2\\cdot(2\\sqrt{2})^{k-1}=2^{\\frac{3k-1}{2}}$，故 $\\log_2 a_k=\\frac{3k-1}{2}$。","若 $n$ 為偶數，每兩項一組：$\\frac{3(2j-1)-1}{2}-\\frac{3(2j)-1}{2}=-\\frac{3}{2}<0$，總和為負，不可能 $>15$。","若 $n=2m+1$ 為奇數：總和 $=-\\frac{3}{2}m+\\frac{3n-1}{2}=\\frac{3n+1}{4}$。由 $\\frac{3n+1}{4}>15$ 得 $n>\\frac{59}{3}=19.67$，故奇數 $n\\geq 21$。","選項中符合的是 $21$ 與 $23$。","觀念回顧：等比數列通項；$\\log$ 將乘除化為加減；交錯級數分奇偶討論。"],"hasFigure":false},{"id":"u9a_9","unit":"九","chapter":"指數與對數函數","track":"A","source":"113 學測數 A 第 1 題","concept":"指數型衰退與半衰期","stem":"研究顯示：服用某藥物後，在使用者體內的藥物殘留量隨時間呈指數型衰退。已知在服用某藥物 $3$ 小時後，體內仍殘留有該藥物的一半劑量，試問下列哪一選項正確？","options":["(1) 服用 $6$ 小時後，體內仍殘留有該藥物的 $\\frac{1}{3}$ 劑量","(2) 服用 $6$ 小時後，體內仍殘留有該藥物的 $\\frac{1}{4}$ 劑量","(3) 服用 $9$ 小時後，體內仍殘留有該藥物的 $\\frac{1}{6}$ 劑量","(4) 服用 $9$ 小時後，體內仍殘留有該藥物的 $\\frac{1}{9}$ 劑量","(5) 服用 $12$ 小時後，體內仍殘留有該藥物的 $\\frac{1}{12}$ 劑量"],"answer":"(2)","explanation":["設服用 $n$ 小時後殘留 $r^n$ 劑量。由 $r^3=\\frac{1}{2}$ 得每 $3$ 小時殘留量變為一半，故 $n$ 小時後殘留 $(\\frac{1}{2})^{n/3}$ 劑量。","檢驗：$6$ 小時後為 $(\\frac{1}{2})^2=\\frac{1}{4}$；$9$ 小時後為 $\\frac{1}{8}$；$12$ 小時後為 $\\frac{1}{16}$。選項 (4) 聲稱 $\\frac{1}{9}$，與計算結果 $\\frac{1}{8}$ 不符，故錯誤。只有 (2) 符合。","觀念回顧：指數型衰退 $y=a\\cdot b^t$；半衰期每經過一個週期量變為一半。"],"hasFigure":false},{"id":"u9a_10","unit":"九","chapter":"指數與對數函數","track":"A","source":"113 學測數 A 第 7 題","concept":"對數函數圖形與定義域","stem":"令坐標平面上滿足 $y=\\log x$ 的點 $(x,y)$ 所成圖形為 $\\Gamma$，試問滿足下列哪些關係式的 $(x,y)$ 所成圖形與 $\\Gamma$ 完全相同？","options":["(1) $y=\\log(4x)-2\\log 2$","(2) $y=\\frac{\\log(x^2)}{2}$","(3) $3y=\\log(x^3)$","(4) $x^2=10^{2y}$","(5) $y=\\log\\sqrt{x^2}$"],"answer":"(1)(3)","explanation":["(1) $y=\\log(4x)-2\\log 2=\\log(4x)-\\log 4=\\log x$（$x>0$），與 $\\Gamma$ 完全相同。","(2) $y=\\frac{\\log(x^2)}{2}=\\log|x|$（$x\\neq 0$），定義域比 $\\Gamma$ 大，不同。","(3) $3y=\\log(x^3)=3\\log x$（$x>0$），得 $y=\\log x$，與 $\\Gamma$ 完全相同。","(4) $x^2=10^{2y}$ 得 $2y=\\log(x^2)$，即 $y=\\log|x|$（$x\\neq 0$），不同。","(5) $y=\\log\\sqrt{x^2}=\\log|x|$（$x\\neq 0$），不同。","觀念回顧：$\\log(x^2)=2\\log|x|$；圖形相同要求關係式與定義域都一致。"],"hasFigure":false},{"id":"u9a_11","unit":"九","chapter":"指數與對數函數","track":"A","source":"114 學測數 A 第 4 題","concept":"對數函數圖形內的格子點","stem":"坐標平面上，$x$ 坐標與 $y$ 坐標均為整數的點稱為格子點。試問在函數圖形 $y=\\log_3 x$、$x$ 軸與直線 $x=\\frac{41}{2}$ 所圍有界區域的內部（不含邊界）共有多少個格子點？","options":["(1) 26","(2) 27","(3) 28","(4) 29","(5) 30"],"answer":"(3)","explanation":["在此區域內，$x$ 可能的整數值為 $2,3,\\cdots,20$。由於 $\\log_3 20<3$（$3^2=9<20<27=3^3$），$y$ 可能的整數值為 $1$、$2$。","若 $y=1$，則 $x>3$，$x=4,5,\\cdots,20$，共 $17$ 個；若 $y=2$，則 $x>9$，$x=10,\\cdots,20$，共 $11$ 個。","總共有 $17+11=28$ 個格子點。","觀念回顧：格子點問題先定出變數範圍再逐一計數；$y=\\log_3 x$ 即 $x=3^y$。"],"hasFigure":false},{"id":"u9a_12","unit":"九","chapter":"指數與對數函數","track":"A","source":"114 學測數 A 第 8 題","concept":"指數方程式與圓的圖形","stem":"考慮坐標平面上滿足方程式 $\\frac{3^{x^2}}{27}=\\frac{9^x}{3^{y^2}}$ 的點 $P(x,y)$，試選出正確的選項。","options":["(1) 當 $x=3$ 時，滿足此方程式的解有相異 $2$ 個","(2) 若點 $(a,b)$ 滿足此方程式，則點 $(-a,-b)$ 也滿足此方程式","(3) 所有可能的點 $P(x,y)$ 構成的圖形為一個圓","(4) 點 $P(x,y)$ 可能在直線 $x+y=5$ 上","(5) 對於所有可能的點 $P(x,y)$，其 $x-y$ 的最大值為 $1+2\\sqrt{2}$"],"answer":"(3)(5)","explanation":["將底數均化為 $3$：$\\frac{3^{x^2}}{3^3}=\\frac{3^{2x}}{3^{y^2}}$，得 $3^{x^2-3}=3^{2x-y^2}$，故 $x^2-3=2x-y^2$，即 $(x-1)^2+y^2=4$。是以 $(1,0)$ 為圓心、$2$ 為半徑的圓。","(1) $x=3$ 代入得 $y=0$，只有 $1$ 個解，錯誤。(2) 圓不對稱於原點，錯誤。(3) 正確。","(4) 圓心 $(1,0)$ 到直線 $x+y=5$ 的距離為 $\\frac{|1-5|}{\\sqrt{2}}=2\\sqrt{2}>2$，圓與直線不相交，錯誤。","(5) 令 $x-y=k$，直線與圓相切時 $k$ 最大：$\\frac{|1-0-k|}{\\sqrt{2}}=2$ 得 $k=1\\pm 2\\sqrt{2}$，最大值為 $1+2\\sqrt{2}$，正確。","觀念回顧：指數相等則指數相等；圓的標準式；點到直線距離；直線與圓相切求極值。"],"hasFigure":false},{"id":"u9a_13","unit":"九","chapter":"指數與對數函數","track":"A","source":"115 學測數 A 第 3 題","concept":"指數律與等差、等比數列","stem":"設 $f(x)=a^x$，其中 $a$ 為正實數。已知 $c_1,c_2,c_3$ 是公差為 $\\frac{8}{3}$ 的等差數列，且 $f(c_1),f(c_2),f(c_3)$ 是公比為 $8$ 的等比數列。則等比數列 $f(6),f(4),f(2)$ 的公比為何？","options":["(1) $2^{-9/4}$","(2) $2^{-9/8}$","(3) $2^{9/8}$","(4) $2^{9/4}$","(5) $2^{8/3}$"],"answer":"(1)","explanation":["由 $\\frac{f(c_2)}{f(c_1)}=8$ 得 $a^{c_2-c_1}=8$，即 $a^{8/3}=8=2^3$，故 $a=2^{9/8}$。","所求公比 $=\\frac{f(4)}{f(6)}=a^{4-6}=a^{-2}=(2^{9/8})^{-2}=2^{-9/4}$。","觀念回顧：$\\frac{a^m}{a^n}=a^{m-n}$；等差數列相鄰兩項差為公差。"],"hasFigure":false},{"id":"u9a_14","unit":"九","chapter":"指數與對數函數","track":"A","source":"115 學測數 A 第 15 題","concept":"三點共線與對數律","stem":"已知三正數 $a,b,c$ 成一等差數列，其中 $a<b<c$，且坐標平面上三點 $(a,\\log 4a)$、$(b,\\log 6b)$、$(c,\\log 12c)$ 在同一直線上，則 $\\frac{b}{a}$ 之值為 ______。","options":[],"answer":"2","explanation":["設公差為 $d>0$，則 $b=a+d$、$c=a+2d$。三點共線即斜率相等：$\\frac{\\log 6b-\\log 4a}{b-a}=\\frac{\\log 12c-\\log 6b}{c-b}$，分母皆為 $d$，故 $\\log\\frac{6b}{4a}=\\log\\frac{12c}{6b}$，得 $\\frac{6b}{4a}=\\frac{12c}{6b}$，即 $(6b)^2=48ac$。","代入 $a=b-d$、$c=b+d$：$36b^2=48(b^2-d^2)$，化簡得 $b^2=4d^2$，故 $b=2d$（$b,d>0$）。","所求 $\\frac{b}{a}=\\frac{2d}{2d-d}=2$。","觀念回顧：三點共線即兩兩斜率相等；$\\log a-\\log b=\\log\\frac{a}{b}$；等差數列設首項公差。"],"hasFigure":false},{"id":"u9b_1","unit":"九","chapter":"指數與對數函數","track":"B","source":"110 試辦學測數 B 第 18 題","concept":"指數律的應用","stem":"有三位學者實驗發現：體重 $w$（公克）的動物在跑動 $1$ 公里時，若每公克體重的基礎耗氧量為 $m$（毫升），則 $w$ 與 $m$ 的關係式為 $m=8.46\\times w^{-0.4}$。體重 $32$ 公克的老鼠，其每公克體重的基礎耗氧量為多少毫升？試選出最接近的選項。","options":["(1) $\\frac{1}{2}$","(2) 1","(3) 2","(4) 4","(5) 8"],"answer":"(3)","explanation":["將 $w=32$ 代入 $m=8.46\\times w^{-0.4}$，得 $m=8.46\\times 32^{-0.4}$。","因為 $32=2^5$，所以 $32^{0.4}=(2^5)^{0.4}=2^2=4$，故 $m=\\frac{8.46}{4}=2.115$。","最接近選項 (3) 的 $2$。","觀念回顧：指數律 $(a^m)^n=a^{mn}$；$a^{-n}=\\frac{1}{a^n}$。"],"hasFigure":false},{"id":"u9b_2","unit":"九","chapter":"指數與對數函數","track":"B","source":"110 試辦學測數 B 第 19 題","concept":"指數相除與比值估算","stem":"承上題的關係式 $m=8.46\\times w^{-0.4}$（$w$ 單位為公克）。體重 $2.5$ 公斤的狗之每公克體重基礎耗氧量是體重 $80$ 公斤的人的幾倍？試選出最接近的選項。","options":["(1) $\\frac{1}{4}$ 倍","(2) $\\frac{1}{2}$ 倍","(3) 1 倍","(4) 2 倍","(5) 4 倍"],"answer":"(5)","explanation":["設狗的耗氧量為 $m_1$、人的為 $m_2$，則 $\\frac{m_1}{m_2}=\\frac{8.46\\times 2500^{-0.4}}{8.46\\times 80000^{-0.4}}=(\\frac{80000}{2500})^{0.4}=32^{0.4}$。","因為 $32=2^5$，所以 $32^{0.4}=(2^5)^{0.4}=2^2=4$。","故狗的每公克體重基礎耗氧量約為人的 $4$ 倍，選 (5)。","觀念回顧：指數相除 $\\frac{a^m}{b^m}=(\\frac{a}{b})^m$；比值估算時先約分再求指數。"],"hasFigure":false},{"id":"u9b_3","unit":"九","chapter":"指數與對數函數","track":"B","source":"110 試辦學測數 B 第 20 題","concept":"對數變換化指數關係為直線","stem":"某實驗測得體重 $w$（公克）與每公克體重基礎耗氧量 $m$（毫升）的關係式為 $m=6.31\\times w^{-0.25}$。令 $w=10^x$，$m=10^y$，且將 $6.31$ 以近似值 $10^{0.8}$ 取代，試寫出 $y$ 對 $x$ 的關係式，並求此直線與 $x$ 軸、$y$ 軸交點的坐標。","options":[],"answer":"y＝−0.25x＋0.8，交點 (0,0.8)、(3.2,0)","explanation":["將 $w=10^x$、$m=10^y$、$6.31=10^{0.8}$ 代入 $m=6.31\\times w^{-0.25}$，得 $10^y=10^{0.8}\\times(10^x)^{-0.25}=10^{0.8-0.25x}$。","兩邊底數相同，故 $y=-0.25x+0.8$。","與 $y$ 軸交點：令 $x=0$，得 $y=0.8$，即 $(0,0.8)$；與 $x$ 軸交點：令 $y=0$，得 $x=3.2$，即 $(3.2,0)$。","觀念回顧：對數變換可將指數關係化為直線；$10^a=10^b$ 則 $a=b$。"],"hasFigure":true},{"id":"u9b_4","unit":"九","chapter":"指數與對數函數","track":"B","source":"111 學測數 B 第 4 題","concept":"對數和、向量加法與象限判斷","stem":"在坐標平面上，已知向量 $\\vec{PQ}=(\\log\\frac{1}{3},-10^{-3})$，其中點 $P$ 的坐標為 $(\\log\\frac{1}{7},3^{-3})$。試選出正確的選項。","options":["(1) 點 $Q$ 在第一象限","(2) 點 $Q$ 在第二象限","(3) 點 $Q$ 在第三象限","(4) 點 $Q$ 在第四象限","(5) 點 $Q$ 位於坐標軸上"],"answer":"(2)","explanation":["$Q=P+\\vec{PQ}=(\\log\\frac{1}{7}+\\log\\frac{1}{3},\\,3^{-3}-10^{-3})$。","橫坐標：$\\log\\frac{1}{7}+\\log\\frac{1}{3}=\\log\\frac{1}{21}=-\\log 21<0$。","縱坐標：$3^{-3}-10^{-3}=\\frac{1}{27}-\\frac{1}{1000}>0$（因為 $\\frac{1}{27}>\\frac{1}{1000}$）。","橫坐標為負、縱坐標為正，故點 $Q$ 在第二象限，選 (2)。","觀念回顧：對數和 $\\log a+\\log b=\\log(ab)$；$\\log\\frac{1}{a}=-\\log a<0$（$a>1$ 時）；向量加法求終點坐標。"],"hasFigure":false},{"id":"u9b_5","unit":"九","chapter":"指數與對數函數","track":"B","source":"111 學測數 B 第 13 題","concept":"對數定義與指數律","stem":"若 $x,y$ 為兩正實數，且滿足 $x^{-\\frac{1}{3}}y^3=1$ 及 $3\\log y=1$，則 $\\frac{x+y^3}{101}=$ ______。","options":[],"answer":"10","explanation":["由 $3\\log y=1$ 得 $\\log y=\\frac{1}{3}$，故 $y=10^{1/3}$，$y^3=10$。","由 $x^{-1/3}y^3=1$ 得 $x^{-1/3}=\\frac{1}{10}$，故 $x^{1/3}=10$，$x=1000$。","因此 $\\frac{x+y^3}{101}=\\frac{1000+10}{101}=10$。","觀念回顧：$\\log y=k$ 則 $y=10^k$；指數律 $x^{-1/3}=\\frac{1}{x^{1/3}}$。"],"hasFigure":false},{"id":"u9b_6","unit":"九","chapter":"指數與對數函數","track":"B","source":"111 參考試卷數 B 第 6 題","concept":"對數方程式（分貝）","stem":"聲音大小（單位為分貝）取決於聲波通過介質時所產生的壓力變化（簡稱聲壓，單位為 $N/m^2$）。已知聲壓 $x$ 與聲音大小 $y$ 的關係式為 $y=10\\times\\log(\\frac{x}{2\\times 10^{-5}})^2$，且目前噪音管制法規範某類工廠的日間聲音不得超過 $60$ 分貝。若某工廠運作時測得的聲音剛好為 $60$ 分貝，則該工廠的聲壓為多少 $N/m^2$？","options":["(1) 0.002","(2) 0.02","(3) 0.2","(4) 2","(5) 20"],"answer":"(2)","explanation":["將 $y=60$ 代入得 $60=10\\times\\log(\\frac{x}{2\\times 10^{-5}})^2$，即 $6=\\log(\\frac{x}{2\\times 10^
